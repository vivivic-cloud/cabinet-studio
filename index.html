<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRS</title>
<style>
/* 색·글꼴은 집(작업대 viggle/index.html :root)에서 그대로 가져왔다.
   에이엠티·조혼가구도 같은 값을 --vg-* 이름으로 쓴다. 집 세 화면 모두 어두운 모드가
   없어 여기서도 뺐다 — 혼자 어두우면 한 집으로 안 보인다. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F4F4F2; --ink:#1A1A19; --ink2:#6E6E6A; --ink3:#9C9C98;
  --line:#E2E2DF; --line2:#EDEDEB; --accent:#111110; --accent-ink:#FFFFFF; --accent-soft:#F4F4F2;
  --dim:#FF3B30; --hidden:#9C9C98; --hatch:#9C9C98; --grid:#E2E2DF; --grid2:#EDEDEB; --ok:#6E6E6A;
  --head:#111110; --fill2:#EAEAE7;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;font-variant-numeric:tabular-nums}
/* 10-01 사장님 말씀 — 「부품표는 부품표보기 버튼으로 보이게 해줘 도면에 집중할 수 있도록」.
   그래서 부품표 칸은 칸 나눔에서 빠졌다. 머리의 「부품표」 단추가 예전 「크게 보기」 판을 연다.
   ⚠ `display:none` 은 **`.bom` 제 규칙에서** 꺼야 한다 — 여기 적으면 뒤에 오는 `.bom{display:flex}` 가 이긴다.
   안 끄면 칸 나눔에 없는 칸이 **저절로 끼어들어** 3D·도면 칸이 40px 로 쭈그러든다(한 번 그랬다). */
.app{display:grid;min-height:100vh;grid-template-columns:284px minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(440px,1fr);
  grid-template-areas:"head head head" "params view3d draw";gap:1px;background:var(--line2)}
.app>*{background:var(--surface);min-width:0}
header{grid-area:head;display:flex;align-items:center;gap:20px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1{margin:0;font-size:23px;line-height:1.06;font-weight:700;letter-spacing:-.9px;color:var(--head);text-wrap:balance}
.tag{font-size:12px;font-weight:400;letter-spacing:0;color:var(--ink3)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;line-height:1.2}
button:hover{background:var(--surface2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--head);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.primary:hover{background:var(--ink);border-color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.params{grid-area:params;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.group{display:flex;flex-direction:column;gap:10px}
/* 10-02 사장님 말씀 「과거의 설정으로 한단계씩 되돌아 갈 수 있는 버튼」 — 머리의 「저장」 곁이다.
   단추라 44px 이다(§0). 되돌릴 것이 없으면 흐리고 안 눌린다. */
#btnUndo{min-height:44px}
#btnUndo[disabled]{opacity:.35}
.group h2{margin:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:800;
  display:flex;align-items:center;gap:8px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line2)}
.field{display:grid;grid-template-columns:1fr 112px;align-items:center;gap:10px}
.field[hidden]{display:none}
.field label,#optDlgBody label{color:var(--ink);font-weight:600;word-break:keep-all}
/* 「뒷판 들어감」 도 같은 자다 — 칸을 좁히고 입력 높이를 44 로 되찾는다(전에는 39.8 이었다) */
.field small{display:block;color:var(--ink3);font-weight:400;font-size:12px;word-break:keep-all}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden}
.num:focus-within{border-color:var(--head)}
.num input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;font-variant-numeric:tabular-nums;padding:9px 10px;text-align:right;min-width:0;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num span{padding:0 11px 0 0;color:var(--ink3);font-size:12px}
select{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 10px;width:100%}
select:focus{border-color:var(--head)}
/* ⚠ 10-04 — 판이 좁아지면 눈금이 **판 밖으로 나갔다**(배율 2.5 에서 마이다 「8」 이 16px 밖 · 아예 안 보임).
   `label` 이 `flex:1` 이라도 `min-width:auto`(= 제 글자 폭) 밑으로는 안 줄어 한 줄에 못 들어간다.
   **줄을 바꿔 여덟 칸이 다 보이게 한다** — `.optnum`·`.optrow` 와 같은 한 벌이다(§4.98619-이름). */
.seg{display:flex;flex-wrap:wrap;gap:4px;border-radius:999px;background:var(--surface2);padding:3px}
.seg label{flex:1;text-align:center;padding:8px 4px;cursor:pointer;font-size:13px;color:var(--ink2);position:relative;border-radius:999px}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:#fff;color:var(--head);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.seg label:has(input:focus-visible){outline:2px solid var(--head);outline-offset:-2px}
.field.wide{grid-template-columns:1fr}
/* 뒷판 줄 — 덮기·끼우기를 이름과 두께 사이 빈자리에 작게 넣는다 */
.field.back,.field.band{grid-template-columns:auto minmax(0,1fr) 112px;gap:8px}
/* 상세옵션 — 사장님 말씀(09-28): 「각 부속의 가로 세로 사이즈를 제시하고 해당 사이즈에 체크시
   결방향이 적용… 각 부속명 클릭시 상세옵션설정이 나타나게… 기본값은 결 없음」.
   부속명이 단추가 되어 제 줄 아래 상세옵션 칸을 펴고 접는다. 결 방향은 이제 거기서만 고른다. */
/* 사장님 말씀(09-28): 「각 부속이 차지하는 높이 영역이 너무 크다 … 조금더 촘촘히 붙어 있게」.
   접힌 줄의 둘째 칸(옵션)은 비어 있는데 `gap:10px` 이 그만큼 세로를 먹고 있었다(줄 54 → 44).
   그래서 세로 틈은 0 으로 두고, 칸이 펴질 때만 `.opt` 가 제 여백을 낸다. */
.field.gr{grid-template-columns:minmax(0,1fr) 96px;grid-template-areas:"이름 두께" "옵션 옵션";
  column-gap:10px;row-gap:0}
.field.gr>.opt:not([hidden]){margin-top:8px}
.field.back.gr,.field.band.gr{grid-template-columns:auto minmax(0,1fr) 112px;
  grid-template-areas:"이름 단추 두께" "옵션 옵션 옵션";gap:8px}
.field.gr>.pname{grid-area:이름}
.field.gr>.segs{grid-area:단추}
.field.gr>.two{grid-area:두께}
.field.gr>.opt{grid-area:옵션}
.segs{display:flex;gap:6px;min-width:0}
.segs>.seg{flex:1 1 0;min-width:0}
/* 부속명 단추 — 보이는 글자는 예전 이름표 그대로 둔다 */
/* 칸을 내려도 줄은 이 단추가 붙잡고 있었다 — 그래서 부속 사이가 안 좁아졌다(사장님 09-30 · 10-03).
   10-03 사장님 말씀 「이제 입력칸의 높이가 줄었으니 **부속간의 간격도 줄여줘**」 로 **입력칸과 같은 23** 이다.
   줄을 더 내리려면 여기 한 줄이다. 폭이 237px 라 23px 로도 글자 줄 전체가 손에 닿는다. */
.pname{display:flex;align-items:center;gap:6px;min-height:23px;padding:0;
  border:0;background:none;color:var(--ink);font:inherit;font-weight:600;
  text-align:left;word-break:keep-all;border-radius:10px}
.pname::after{content:"▾";font-size:11px;color:var(--ink3);flex:none}
.pname[aria-expanded="true"]::after{content:"▴";color:var(--head)}
.pname:hover{color:var(--head)}
/* 10-05 — 「서랍설정」 은 부속 이름표가 아니라 **메뉴 단추**다. 단추는 44px 이다(§0). */
.pname.big{min-height:44px}
.opt[hidden]{display:none}
 /* 09-28 사장님 말씀 **두 번** — 「이런 입력칸의 높이가 너무 커 … 좀 작게좀 조절해줘」,
   그리고 「이노무 입력칸좀 줄여달라니까」. 첫 판은 44px 을 지켜 46px 줄이 그대로여서 **눈에 안 띄었다.**
   **그래서 입력칸은 34px 이었다. 44px 규칙은 단추에만 쓴다** (관리자가 제 말을 물렸다 · 사장님 글자가 이긴다).
   × · 세그먼트 · 「추가」 같은 **단추는 44px 그대로 둔다** — 사장님이 짚으신 것은 글자 넣는 칸이다.
   10-02 사장님 말씀: 「**입력부 칸의 높이가 여전히 큽니다. 현재의 3분의 2 수준으로 줄여줘**」.
   **그래서 입력칸은 이제 23px 이다**(34 × 2/3 = 22.67 → 23). 줄(`.optnum`)도 36 → **24** 로 같이 내렸다 —
   칸만 줄이고 줄을 그대로 두면 **사장님 눈에 아무것도 안 바뀐다**(09-28 에 그렇게 한 번 헛일했다).
   **34 로도 46 으로도 되돌리지 마라.** */
.opt{display:flex;flex-direction:column;gap:2px;margin-top:-4px;padding:5px 8px 6px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.opthead{font-size:12px;font-weight:700;color:var(--ink2);padding-bottom:2px}
.opthead small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3);line-height:1.5;padding-top:2px}
/* ⚠ 10-04 — 결 방향 줄도 좁아지면 이름이 깎였다(배율 2.5 에서 「가로 896mm」 90/111).
   `.optnum` 과 같은 한 벌이다 — 안 쪼개지는 이름은 제 폭을 지키고, 그래서 치수가 아랫줄로 내려간다. */
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:44px;padding:0 4px;border-radius:10px;cursor:pointer}
.optrow:hover{background:var(--fill2)}
.optrow input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--head)}
.optrow span{flex:1;min-width:min-content;font-size:13px;color:var(--ink)}
.optrow b{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;
  font-size:13px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.optrow b i{font-style:normal;font-size:11px;color:var(--ink3);padding-left:2px}
.optrow:has(input:checked){background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.optrow:has(input:checked) span{font-weight:700;color:var(--head)}
.optwide{display:flex;flex-direction:column;gap:3px;padding:0 4px 1px}
.optwide label{font-size:13px;color:var(--ink)}
/* 전면밴드 칸이 칸 폭을 다 먹고 있었다(305px · 입력 39.8px). 폭을 유격 칸과 같이 맞추고 높이를 44 로 되찾는다. */
.optwide>.num{width:82px;border-radius:11px}
.optwide>.num input{min-height:23px;height:23px;padding:0 6px;font-size:13px}
/* ⚠ 10-04 — 판이 좁아지면 **이름이 깎였다**(배율 2.5 에서 「상부유격」 이 폭 0). 이름 없는 수치칸 둘이
   나란히 서면 위 유격인지 아래 유격인지 모른 채 숫자를 치시게 된다. **깎이는 대신 수치칸을 아래로 내린다** —
   `flex-wrap:wrap` 과 이름의 `min-width:min-content` 가 한 벌이다. 이름이 제 글자 폭 밑으로 안 눌리므로
   둘이 한 줄에 못 들어가는 순간 수치칸이 저절로 아랫줄로 내려간다. **넓을 때는 한 줄 그대로다.** */
.optnum{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:24px;padding:0 4px}
/* 칸이 23px 로 낮아졌다 — **닿는 자리는 줄 전체**다(10-02 관리자). 이름표에 `for` 가 붙어 있어
   줄 어디를 밟아도 그 줄의 칸에 초점이 잡힌다(맨 위·가운데·맨 아래를 진짜 손가락으로 밟아 3/3 확인).
   ⚠ `::after` 로 44px 을 얹지 마라 — **줄 피치가 27px 이라 윗줄·아랫줄 것을 17px 씩 뺏는다.**
   `input` 에는 `::after` 가 아예 안 먹는다(§4.9895 의 `select` 와 같다). */
.optnum label{flex:1 1 auto;min-width:min-content;font-size:13px;color:var(--ink)}
.optnum .num{flex:none;width:82px;border-radius:11px}
.optnum .num input{min-height:23px;height:23px;padding:0 6px;font-size:13px}
/* 「12.5」 가 1px 잘렸다 — 「mm」 꼬리표 여백과 글자를 깎아 숫자 자리를 넓힌다(관계제어판은 안 건드린다) */
.optnum .num span,.optwide>.num span{padding:0 6px 0 0;font-size:11px}
/* 10-06 — 레일 고르개. **값을 고르는 칸이라 23px 이다**(§0 — 44px 은 단추에만).
   ⚠ 25 는 **유격 칸의 겉 네모와 같은 값**이다 — 거기는 `.num`(테두리 1px 두 겹) 안에 23px `input` 이 들어
   겉이 25 가 된다. `select` 는 테두리가 제 몸에 있으므로 23 으로 두면 **2px 짧아 보인다**(재서 잡았다).
   `.optnum .num` 과 같은 폭(82)·같은 둥글기라 유격 칸들과 한 줄에서 나란히 선다. */
.optnum select{flex:none;width:82px;height:25px;min-height:25px;padding:0 6px;font-size:13px;border-radius:11px}
/* 10-01 사장님 말씀 — 상세옵션의 수치는 「저장」 을 눌러야 적용된다.
   「저장 닫기 버튼 너무 크다 너무 커요 지금의 4분의 1수준으로 조절해줘」 — 그래서 꽉 채우지 않고
   오른쪽에 작게 둔다. **보이는 크기는 1/4 로 줄이고 닿는 자리는 `::after` 로 36px 을 남겼다**
   (위 틈 8 + 아래 여백 6 안에 들어가므로 윗줄과 안 겹친다. 44 로 넓히면 윗줄을 먹는다 — 재서 잡았다). */
.optbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:8px}   /* 좁으면 「닫기」 가 아랫줄로 — 판 밖으로 나가지 않는다 */
.optbtns button{flex:none;min-height:28px;padding:0 14px;font-size:12px;position:relative}
.optbtns button::after{content:'';position:absolute;left:0;right:0;top:-4px;bottom:-4px}
#itemSel{min-height:44px}   /* 고르개는 ::after 가 안 먹는다 — 닿는 자리를 높이로 잡는다 (§4.9895) */
.seg.mini{padding:2px;gap:2px}
.seg.mini label{padding:7px 2px;font-size:11.5px;letter-spacing:-.02em;white-space:nowrap;position:relative}
/* 보이는 알약은 31px 그대로 두고 손이 닿는 자리만 44px 로 넓힌다 — 줄 높이는 안 변한다 */
.seg.mini label::after{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}
.seg.mini label.못씀{opacity:.38}   /* 지금은 안 서는 단 — 눌리기는 눌리고 까닭을 알린다 */
input[type=range]{width:100%;accent-color:var(--head)}
.stats{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding-top:14px;border-top:1px solid var(--line2)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink2);letter-spacing:.04em}
.view3d{grid-area:view3d;position:relative;background:var(--surface2);min-height:440px}
.view3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hud{position:absolute;left:14px;top:70px;right:14px;   /* 치수 띠(12 + 46 + 12) 밑으로 내렸다 */display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;pointer-events:none}
.hud>div{display:flex;gap:4px;pointer-events:auto;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
/* 손에 닿는 자리는 44px — 사장님 말씀(09-22) 「숨기기 취소 어디갔니?」 로 짚으신 그 줄이다.
   폰에서 도구줄은 돌리기·옮기기의 유일한 길이다. 줌은 **두 손가락으로 확대·축소**도 된다(09-30 사장님 말씀 · §4.7).
   단추를 없애지 마라 — 핀치는 더한 것이다. 375px 에서 두 줄이 각각 한 줄에 들어간다. */
.hud button{min-height:44px;min-width:44px;padding:0 12px;font-size:12px;background:transparent;border-color:transparent;border-radius:999px}
.hud button:hover{background:var(--fill2)}
.hud button[aria-pressed="true"]{background:#fff;color:var(--head);font-weight:700;border-color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.hud>div[hidden]{display:none}
.hud .hidbar{flex-basis:100%;justify-content:flex-end;gap:6px;background:none;border:0;padding:0;pointer-events:none}
.hidbar button{pointer-events:auto}
/* 사장님 말씀(09-22) 「숨기기 취소 어디갔니?」 — 28px 이라 손에 안 닿았다. 집 규칙대로 44px 로 올렸다. */
.hidbar button{background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  min-height:44px;padding:0 14px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.hidbar #btnHid{font-weight:700}
.hidbar button:hover{background:var(--fill2)}
#hidmenu{position:fixed;z-index:60;display:none;flex-direction:column;gap:2px;min-width:170px;max-width:min(280px,86vw);max-height:52vh;overflow:auto;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#hidmenu.on{display:flex}
#hidmenu b{padding:6px 12px 4px;font-size:12px;font-weight:600;color:var(--ink3)}
#hidmenu button{min-height:44px;padding:11px 12px;text-align:left;border:0;border-radius:10px;background:none}
#hidmenu button:hover{background:var(--surface2)}
#hidmenu small{color:var(--ink3)}
.hint{position:absolute;left:14px;bottom:56px;font-size:11px;color:var(--ink3);letter-spacing:.04em;pointer-events:none}
.view3d canvas.tool-select{cursor:default}.view3d canvas.tool-orbit{cursor:grab}.view3d canvas.tool-pan{cursor:move}.view3d canvas.tool-zoom{cursor:zoom-in}
.view3d canvas.dragging{cursor:grabbing}
/* 10-06 「동작」 의 나옴 딱지 — 서랍 옆 틈에 떠서 측판 끝에서 나온 거리를 적는다(§4.9850-나옴).
   `.view3d` 가 `position:relative` 라 그 안에서 뜬다. 폰 갈래(`position:static`) 목록에 넣지 마라 —
   흐름에 들어가면 도면을 아래로 민다. */
.outtag{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-50%);
  padding:2px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  font:600 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* 도구줄(선택·궤도·이동·줌·전체)은 마우스 있는 곳에서는 감춘다 — 사장님 말씀(09-17 「마우스로 다 된다」).
   마우스는 이 단추를 아예 안 본다: 왼쪽 끌기=이동 · 휠 끌기=궤도 · 스크롤=줌 · Shift+Z=전체.
   손가락으로 돌리기·옮기기는 이 단추가 유일한 길이다 — 폰에서는 그대로 둔다.
   줌은 09-30 부터 **두 손가락으로도** 된다(사장님 말씀). 단추는 그대로 남긴다. */
.mouseonly{display:none}
@media (hover:hover) and (pointer:fine){ .hud .tools{display:none} .mouseonly{display:inline} }
.explode{position:absolute;right:14px;bottom:12px;left:14px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;max-width:360px;margin-left:auto}
.explode label{font-size:12px;color:var(--ink2);white-space:nowrap}
/* 10-06 — 「분해 / 동작」 고르개(§4.9850).
   ⚠ `.seg.mini label::after` 는 **세로만** 44 로 잡아 준다 — `left:0;right:0` 이라 **가로는 글자네모 그대로**다.
      옵션 판 안의 알약은 판 폭을 꽉 채워 넓지만, 이 띠는 `flex:none` 이라 한 칸이 27.55px 밖에 안 됐다.
      그래서 **보이는 알약을 44 로 넓힌다**(아래 `min-width` · 10-06 관리자가 정했다).
      ⚠ `::after` 만 넓히던 판으로 되돌리지 마라 — 그 판에서는 **진짜 손가락으로 재면 「동작」 이 41px 밖에 안 됐다**.
         밀대 네모가 90.09 에서 시작해 **0~83 의 84칸을 둘이 나눠야 해서 44+44 가 산술로 안 들어간다**(재서 잡았다).
         알약을 넓혀 밀대를 123 으로 밀어야 비로소 둘 다 44 를 넘는다(64 · 53).
   ⚠ 폰에서 이 띠는 **흐름 안에 서서 도면을 아래로 민다**(§4.9861). 그래서 띠 높이를 **예전 그대로 38px 에 못 박는다** —
      여백만 줄이면 41 이 되어 밑의 `.params` 가 2.672px 밀리고, 그러면 부속 줄 × 의 **닿는 네모 맨 아랫점이
      손가락 보정에 밀려 아랫줄을 지운다**(재서 잡았다 · §0 의 「작은 과녁 × 지우기」). 이 한 줄을 지우지 마라. */
.explode:has(>.seg){padding-top:0;padding-bottom:0;min-height:38px}
.explode>.seg{flex:none}
/* 보이는 알약을 44px 로 넓히고, 닿는 네모가 **알약 밖 빈자리까지** 덮게 한다(10-06 관리자).
   ⚠ `.seg.mini` 전역을 건드리지 마라 — 옵션 판 여러 곳이 그 규칙을 쓴다. 이 띠 안의 것만 잡는다.
      옵션 판 알약은 판 폭을 꽉 채워 이미 넓다(375 에서 175.5px) — 전·후가 글자까지 같다(재 봤다).
   ⚠ 아래 두 줄은 **알약 밖 빈자리를 줍는 것**이고, 둘이 서로의 손가락을 안 뺏게 갈라 붙인다.
      「분해」 는 왼쪽으로 **19px**(= 띠 왼여백 16 + 테두리 1 + seg 여백 2) 를 먹어 **왼끝이 0** 이다 —
      그 19px 을 안 주우면 **화면 맨 왼쪽 18칸이 아무것도 안 눌리는 자리로 남는다**(재서 잡았다 · 내가 더한 것).
      「동작」 은 둘 사이 틈(2px) 가운데 **1px 만** 왼쪽으로 먹는다.
   ⚠ `right:-0.5px` 의 0.5 를 지우지 마라 — 알약 폭이 **딱 44 정수**라 오른끝이 정수에 떨어진다.
      네모는 오른끝을 **안 품으므로**(`[왼, 오)`) 0.5 를 안 주면 **알약 맨 오른쪽 정수 한 칸이 아무것도 아닌 자리**가 된다
      (재서 잡았다 — 알약밖 `[63]`·`[109]`). 「동작」 왼끝을 **−2px** 로 두면 그 칸을 뒤엣것이 뺏는다(내림 claim · 그래서 −1px 다). */
.explode .seg.mini label{min-width:44px}
.explode .seg.mini label::after{left:-19px;right:-0.5px;width:auto}
.explode .seg.mini label+label::after{left:-1px;right:-0.5px;width:auto}
.explode input[type=range]{flex:1;min-width:0}
.viewtag{position:absolute;left:14px;bottom:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;font-size:11px;color:var(--ink3);letter-spacing:.08em}
.draw{grid-area:draw;display:flex;flex-direction:column;min-height:440px}
.panelhead{display:flex;align-items:baseline;gap:10px;padding:12px 18px 8px;border-bottom:1px solid var(--line2)}
.panelhead h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--head)}
.panelhead .eyebrow{margin-left:auto}
/* ── 2D·3D 모드 — 한 번에 하나만 보인다 (09-22 사장님 말씀) ──────────────────
   가르는 것은 `.view3d` 와 `.draw` 딱 둘이다. **부속표(`.bom`)는 두 모드 다 그대로 둔다.**
   `display:none` 으로 확실히 숨긴다 — 자리만 차지하면 도면이 안 커진다.
   바꾸는 단추는 두 칸에 하나씩 둔다. 한 번에 하나만 보이므로 늘 눈앞에 있다. */
.modeseg{display:flex;gap:4px;flex:none;align-self:center}
.panelhead .modeseg{margin-left:10px}
/* 외형 치수 띠 — `.hud` 와 같은 본이다. 떠 있으므로 칸 높이를 한 픽셀도 안 뺏는다. */
/* 10-01 사장님 말씀 — 「2D/3D 변환시 외경입력부의 이질감이 없도록 해줘 두가지의 입력부가 너무 다르게
   생겼고 위치도 다름」. 그래서 **두 모드가 같은 폭·같은 자리**다 — 칸 왼위에서 14·12 띄우고 270px 이다.
   2D 는 머리줄 밑이 칸의 시작이라 `모드띠맞추기()` 가 머리줄 높이에 12 를 더해 준다(상대 자리가 같다). */
.dims{position:absolute;z-index:6;left:14px;right:auto;top:12px;width:min(calc(100% - 28px), 270px);display:flex;gap:4px}
.dims .d{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:2px;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 7px}
.dims .d:focus-within{border-color:var(--head)}
.dims i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink2);flex:none}
/* 폰 2D 에서 칸이 85px 까지 좁아진다 — 네 자리(1800)가 안 잘리게 글자를 줄이고 여백을 깎았다. */
.dims input{flex:1 1 0;min-width:34px;width:100%;border:0;background:transparent;color:var(--ink);
  font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;font-variant-numeric:tabular-nums;
  font-size:13px;padding:0 1px;text-align:right;-moz-appearance:textfield;min-height:23px;height:23px}
.dims input::-webkit-outer-spin-button,.dims input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dims span{font-size:9.5px;color:var(--ink3);flex:none}
/* 쪽 오른쪽 위 「크게」 단추(56×44)를 덮으면 아예 안 눌린다 — 그래서 띠는 왼쪽에 짧게 둔다(재서 확인했다).
   10-01 부터 3D 도 같은 폭이라 따로 둘 규칙이 없어졌다. */
.draw{position:relative}
.modeseg button{min-width:52px;min-height:44px;padding:0 12px;font-size:13px;border-radius:999px}
.modeseg button[aria-pressed="true"]{background:var(--head);color:#fff;font-weight:700;border-color:transparent}
.app.m3d .draw{display:none}
.app.m2d .view3d{display:none}
.svgwrap{flex:1;min-height:0;padding:10px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.svgwrap svg{width:100%;height:100%;display:block}
.svgwrap .OUTLINE{stroke:var(--ink);stroke-width:1.4px}
.svgwrap .HIDDEN{stroke:var(--hidden);stroke-width:.85px;stroke-dasharray:9 6}
.svgwrap .DIM{stroke:var(--dim);stroke-width:.7px}
.svgwrap .HATCH{stroke:var(--hatch);stroke-width:.5px}
.svgwrap .TITLE{stroke:var(--ink3);stroke-width:.8px}
.svgwrap .강{stroke:var(--ink2);stroke-width:1.2px}
.svgwrap .옅음{opacity:.4}
.svgwrap text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;fill:var(--ink2)}
.svgwrap text.DIM{fill:var(--dim)}
.svgwrap text.TEXT{fill:var(--accent)}
.svgwrap text.TITLE{fill:var(--ink)}
/* 고른 부속 — 3D 와 같은 빨강. 선은 굵기 그대로 색만 바꾼다(밖으로 안 번지게).
   칠은 그 부속 네모 안에만 든다. 짚을 자리(.pick)는 보이지 않고 손가락만 받는다. */
.svgwrap .pick{fill:transparent;stroke:transparent;stroke-width:22px;pointer-events:all;cursor:pointer}
.svgwrap line.sel{stroke:var(--dim)}
.svgwrap rect.pick.sel{fill:rgba(255,59,48,.18)}
/* 도면 칸은 A4 여러 쪽이 위아래로 이어진 곳이다. 1쪽은 전체도면, 2쪽부터는 부속 하나하나.
   쪽 하나가 A4 한 장(210×297mm) 비율이라 인쇄하면 그대로 종이 한 장이 된다. */
.svgwrap .page{position:relative;width:100%;aspect-ratio:210/297;margin:0 auto 12px;border:1px solid var(--line);background:var(--surface)}
.svgwrap .page:last-child{margin-bottom:0}
/* 한 쪽씩 보고 아래 썸네일로 고른다 — 사장님 말씀(09-22)
   「2d시 화면이 너무 커서 전체를 둘러보기 어렵습니다. 현재페이지를 적당한 사이즈로 줄이고
     나머지 부분은 아래에 썸네일로 페이지 선택해서 볼 수 있게」 */
#svgwrap{display:flex;flex-direction:column;overflow:hidden;padding:10px}
.pagebox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pagebox>.page{margin:0;flex:none}
#pageBox>.page:not(.보는쪽){display:none}   /* .page.p1{display:flex} 보다 세게 — 아이디로 이긴다 */
/* 쪽을 칸 안에 통째로 넣는다 — 세로가 모자라면 세로에 맞춘다. 못 받는 브라우저는 예전처럼 폭에 맞춘다. */
@supports (container-type:size){
  .pagebox{container-type:size}
  .pagebox>.page{width:min(100cqw, calc(100cqh * 210 / 297))}
}
.thumbs{flex:none;display:flex;gap:8px;align-items:flex-start;
  overflow-x:auto;overflow-y:hidden;padding:9px 2px 2px;-webkit-overflow-scrolling:touch}
.thumbs:empty,.thumbs[hidden]{display:none}
.thumb{flex:none;width:56px;padding:3px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink3);font-size:11px;line-height:1.5;text-align:center}
.thumb .tp{display:block;width:100%;aspect-ratio:210/297;overflow:hidden;background:#fff;
  border-radius:4px;pointer-events:none}
.thumb .tp svg{width:100%;height:100%;display:block}
.thumb .tp *{pointer-events:none}
.thumb .tl{display:block;padding-top:2px;white-space:nowrap}
.thumb[aria-selected="true"]{border-color:var(--head);color:var(--head);font-weight:700;
  box-shadow:0 0 0 1px var(--head)}
.thumb:hover{background:var(--fill2)}

.svgwrap .pnum{position:absolute;right:9px;bottom:5px;font-size:11px;color:var(--ink3)}
/* 쪽마다 「크게」 — 눌러서 한 쪽을 화면 가득 본다. 누르는 자리 44px 이상. */
.svgwrap .page .big{position:absolute;right:8px;top:8px;min-width:56px;min-height:44px;padding:0 12px;
  font-size:13px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);z-index:2}
.svgwrap .page .big:hover{background:var(--fill2)}
/* 큰 그림 창 — 화면을 가득 덮는다. 손가락 하나로 밀고, 둘로 벌려 키운다. */
dialog.zoom{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;padding:0;border:0;border-radius:0;
  background:var(--surface);color:var(--ink);overflow:hidden}
/* 머리줄은 폰에서 두 줄로 접힌다. 그래서 높이를 박아 두지 않고 남는 자리를 그림이 다 쓰게 한다 —
   61px 로 박아 두었더니 375px 에서 그림이 단추 밑으로 파고들었다. */
dialog.zoom[open]{display:flex;flex-direction:column}
dialog.zoom::backdrop{background:rgba(17,17,16,.72)}
.zoomhead{flex:none;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;
  padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.zoomhead>b{font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoombtns{display:flex;align-items:center;gap:6px;flex:none}
.zoombtns button{min-width:44px;min-height:44px;padding:0 12px;font-size:14px;border-radius:12px}
.zoombtns #zoomPct{min-width:52px;text-align:center;font-size:12px;color:var(--ink3)}
.zoomwrap{position:relative;flex:1 1 auto;min-height:0;padding:0;overflow:hidden;
  touch-action:none;background:var(--fill2);display:block;cursor:grab}
.zoomwrap.끄는중{cursor:grabbing}
.zoomwrap .zoombox{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.zoomwrap .page{margin:0;width:100%}
.zoomwrap .pick{pointer-events:none}          /* 큰 그림에서는 부속을 짚지 않는다 — 밀고 키우는 자리다 */
.zoomwrap .big{display:none}                  /* 큰 그림 안에 또 「크게」 를 두지 않는다 */
/* 1쪽은 도면 아래에 차례가 붙는다. 도면은 남는 만큼 쓰고 차례는 제 높이만 쓴다. */
.svgwrap .page.p1{display:flex;flex-direction:column}
.svgwrap .page.p1>svg{flex:1;min-height:0;height:auto}
.svgwrap .toc{flex:none;padding:0 4.8% 3.4%;display:flex;flex-direction:column;gap:2px}
.svgwrap .toc b{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--ink3)}
.svgwrap .toc>div{font-size:11.5px;color:var(--ink2);line-height:1.35}
.svgwrap .toc>div>span{display:inline-block;min-width:32px;font-weight:700;color:var(--head)}
@media (max-width:760px){.svgwrap .toc b{font-size:11px}.svgwrap .toc>div{font-size:13px}.svgwrap .pnum{font-size:13px;font-weight:700;color:var(--ink2)}}
/* 부속 쪽(.pg)은 mm 를 그대로 단위로 쓴다. 글자는 화면과 종이에서 크기가 달라야 한다 —
   폰에서는 A4 한 장이 355px 로 눌려 종이 크기 글자가 4px 이 된다. */
.pg text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;fill:var(--ink2);dominant-baseline:central}
.pg .ln{stroke:var(--ink);stroke-width:.35px;fill:none}
.pg .ln2{stroke:var(--ink3);stroke-width:.2px}
.pg .dim{stroke:var(--dim);stroke-width:.18px}
.pg .gr{stroke:var(--accent);stroke-width:.22px}
/* 엣지가 붙는 변 — 겉면 선(.35)의 2.6배. 재서 고른 값이다: .35 는 안 보이고 1.4 는 치수선을 먹는다 */
.pg .엣지{stroke:var(--ink);stroke-width:.9px;fill:none}
.pg .t1{font-size:5px;fill:var(--head);font-weight:700}
.pg .t2{font-size:3.6px;fill:var(--ink)}
.pg .t3{font-size:3px;fill:var(--dim)}
.pg .t4{font-size:2.9px;fill:var(--ink3)}
/* 정보 칸의 **긴 값**(「재단 사이즈 1799.5 × 399」)용 — t2 그대로면 폰에서 이름을 덮는다(재서 잡았다) */
.pg .tv{font-size:3.2px;fill:var(--ink)}
.pg .t5{font-size:2.5px;fill:var(--ink3)}
@media (max-width:760px){.pg .t1{font-size:8px}.pg .t2{font-size:6px}.pg .t3{font-size:5.2px}.pg .t4{font-size:4.8px}.pg .t5{font-size:4.2px}.pg .tv{font-size:4.6px}}
.bom{grid-area:bom;display:none;flex-direction:column}   /* 10-01 — 「부품표」 단추로만 본다 */
.bom table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.bom th,.bom td{padding:7px 18px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
.bom th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.bom td:first-child,.bom th:first-child{text-align:left}
.bom td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
.addrow{display:flex;align-items:center;gap:6px;position:relative}
/* 「부속 이름」 칸에 붙는 드롭다운 — 칸 바로 아래에 이어 붙는다(따로 뜨는 판이 아니다).
   사장님 말씀(09-17): 「칸 안에 드롭다운 목록으로, 딸림말 없이 이름만, 도면에 있는 것은 빼고」. */
.namedrop{position:absolute;left:0;top:calc(100% + 2px);width:calc(100% - 66px);z-index:30;
  border:1px solid var(--head);border-radius:13px;background:#fff;overflow:hidden auto;max-height:228px;
  box-shadow:0 6px 18px rgba(0,0,0,.12)}
.namedrop[hidden]{display:none}
.namedrop button{display:block;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:0;
  background:transparent;text-align:left;font-size:14px;color:var(--ink)}
.namedrop button+button{border-top:1px solid var(--line)}
.namedrop button:hover,.namedrop button.on{background:var(--fill2)}
.addrow input{flex:1;min-width:0;min-height:23px;height:23px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:0 10px}
.addrow input:focus{outline:none;border-color:var(--head)}
.addrow button{flex:none;min-height:44px}   /* 단추는 44px 그대로 — 칸만 23 으로 내렸다 */
.two{display:flex;gap:10px;align-items:center}   /* 두께 칸과 × 를 띄운다 — 잘못 눌리지 않게 */
/* 보이는 것은 줄이고 닿는 자리는 44px 을 지킨다 (09-28 사장님 말씀 · 집 규칙 §0).
   select 는 ::after 를 못 얹으므로 **제 몸이 곧 닿는 자리**다 — 높이 44 는 지키고 폭·글자를 줄였다. */
/* 09-30 사장님 말씀: 「이곳 사이즈 입력칸 아직도 커요 이로인해 부속간 여백이 커져있습니다」(측판 줄을 짚으시고).
   이 고르개가 곧 사장님이 말씀하시는 「사이즈 입력칸」 이다 — §0 의 입력칸 자를 여기에도 댄다.
   `select` 는 `::after` 를 못 얹으니 제 몸이 곧 닿는 자리다. 10-02 에 **23** 으로 내렸다. */
.two select,.two input{flex:1;min-width:0;width:0;height:23px;min-height:23px;padding:0 6px;font-size:13px;border-radius:11px}
/* 10-03 사장님 말씀: 「삭제버튼은 여전히 크니 **지금의 절반정도로** 줄여줘」 → 28 → **20**(넓이 절반).
   한 변을 절반(14)으로 보면 글자가 눌려 ×가 안 읽힌다 — §4.9891 에서 「4분의 1 수준」 을 넓이로 읽은 그 자다. */
.two .x{flex:none;width:20px;height:20px;padding:0;border-radius:50%;line-height:1;font-size:13px;color:var(--ink3);position:relative}
/* 보이는 것은 줄이고 손 닿는 자리만 넓힌다 (집 규칙) */
.two .x::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:27px}
/* ⚠ **보이는 크기와 닿는 자리는 다른 것이다** (10-03 관리자 · 집 규칙 §0).
   사장님 「절반으로」 는 **눈에 보이는 ×** 이야기다 — 그건 28 → 20 으로 이미 했다.
   닿는 자리는 눈에 안 보이므로 같이 줄일 까닭이 없고, **지우는 단추라 작은 과녁은 제일 나쁘다.**
   (한 번 22×20 으로 줄였다가 관리자가 되돌리라 해서 40×27 로 돌아왔다.)
   세로 27 = 줄 23 + 틈 4 · 가로 40 = × 20 + 양옆 틈 10 — **이보다 넓히면 이웃 줄·두께 칸을 뺏는다.** */
#boardBox{gap:4px}                /* 줄끼리 촘촘히 — 23px 줄에 4px 틈이면 닿는 자리가 안 겹친다 */
.two .x.없음{opacity:.3}          /* 이미 도면에서 빠진 것 */
/* 지운 부속은 「비활성 부속」 무리로 목록 아래에 모은다 (09-22 사장님 말씀).
   설정 때문에 없는 줄(도어 0짝 · 이동선반 0단 · 전면밴드 0)은 **안 내린다** — 제자리에 둔다. */

.two .x:hover{background:var(--surface2);color:var(--dim)}
.linkbtn{background:none;border:0;padding:4px 0;font-size:12px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;cursor:pointer;border-radius:0}
.linkbtn:hover{background:none;color:var(--head)}
.warn{display:block;color:var(--dim);font-size:12px;min-height:0}
.rgrp{border-top:1px solid var(--line2);padding-top:12px;margin-top:4px}
.rgrp h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.rrow{display:grid;grid-template-columns:1fr 112px;align-items:center;gap:10px;margin:0 0 8px}
.rrow label{font-weight:600}
.rrow.nm{grid-template-columns:auto 1fr}
.krow{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.krow:first-child{border-top:0}
.krow.wide{grid-template-columns:1fr;gap:6px}
.krow b{display:block;font-size:12px;font-weight:700;color:var(--head);letter-spacing:-.2px}
.krow small{display:block;margin-top:2px;color:var(--ink2);font-size:12.5px;line-height:1.4;word-break:keep-all}
.kv{text-align:right}
.kv .fix{font-size:12.5px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
.kv .lock{display:block;margin-top:2px;font-size:11px;color:var(--ink3);word-break:keep-all}
#rTable h5{margin:14px 0 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--head);font-weight:800}
#rTable h5:first-child{margin-top:0}
#rTable h5 + .krow{border-top:0}
.rrow small{display:block;color:var(--ink3);font-weight:400;font-size:12px;word-break:keep-all}
.rrow input[type=text]{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;padding:9px 12px}
.rrow input[type=text]:focus{outline:none;border-color:var(--head)}
.rdlg{max-height:76vh;overflow:auto}
#rFix .none{margin:0;color:var(--ink3);font-size:13px}
.bdlg{height:86vh;max-height:86vh}                     /* 높이를 못 박는다 — 그림을 키워도 단추 줄이 안 움직인다 */
.brow{display:flex;align-items:center;gap:12px}
.brow h3{margin:0;font-size:17px;font-weight:700;color:var(--head)}
.bzoom{margin-left:auto;display:flex;align-items:center;gap:6px}
.bzoom button{min-width:44px;min-height:44px;padding:6px 10px;font-size:17px;line-height:1}
.bzoom b{min-width:58px;text-align:center;font-size:13px;color:var(--ink2)}
.bview{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;-webkit-overflow-scrolling:touch}
.bdlg .row{flex-wrap:wrap;flex:none}
.bdlg .row button{white-space:nowrap;min-height:44px;padding:10px 16px}
.brow{flex:none}
.bview svg{display:block;height:auto}
#bomWrap{cursor:zoom-in}
#pmenu{position:fixed;z-index:60;display:none;flex-direction:column;gap:2px;min-width:140px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#pmenu.on{display:flex}
#pmenu b{padding:6px 12px 4px;font-size:12px;font-weight:600;color:var(--ink3)}
#pmenu button{min-height:44px;padding:11px 12px;text-align:left;border:0;border-radius:10px;background:none}
#pmenu button:hover{background:var(--surface2)}
/* 10-04 사장님 말씀 — 「도면에서 부속선택시 옵션보기 … 해당부속의 옵션조정 화면이 팝업」.
   `#pmenu` 보다 위에 뜬다(60 → 70). 폰에서 아래로 안 내려가도 되게 **고정 자리에 가운데**다.
   판이 길면 제 안에서 굴러간다 — 바깥(도면·입력칸)은 한 픽셀도 안 밀린다. */
/* ⚠ 10-04 — 폰에서 「상부 일부만 나오고 모두 잘려요」. **보이는 높이를 안 보고 있었다.**
   `100vh` 와 `top:50%` 는 **깔림 화면(layout viewport)** 을 잰다. 아이폰은 글쇠가 올라오거나
   주소창이 보이거나 손가락으로 벌리면 **보이는 화면(visual viewport)이 그보다 작아진다** —
   그러면 가운데가 아래로 밀려 **아랫도리가 보이는 데 밖으로 나간다**(잰 값: 배율 2 에서 151px).
   그래서 자리·크기를 **`visualViewport` 로 잡는다**(`팝업자리맞추기`) — **세로만이 아니라 가로도**다
   (세로만 잡았더니 배율 2 에서 오른쪽이 165px 잘린 채였다). 아래 `left:50%`·`100dvh`·`100vw` 는
   `visualViewport` 가 없는 브라우저를 위한 받침이고, 있으면 그 함수가 px 로 덮어쓴다. */
dialog.optpop{position:fixed;z-index:70;margin:0;top:12px;left:50%;transform:translateX(-50%);
  width:min(calc(100vw - 24px),330px);max-width:none;max-height:calc(100dvh - 24px);
  padding:0;overflow:hidden;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);box-shadow:0 18px 50px rgba(0,0,0,.28)}
dialog.optpop[open]{display:flex;flex-direction:column}
dialog.optpop::backdrop{background:rgba(17,17,16,.28)}
.optpophead{flex:none;padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.optpophead b{font-size:13px;font-weight:700;color:var(--head)}
#optDlgBody{flex:1;min-height:0;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
#optDlgBody>.opt{margin-top:0}
.bom tbody tr.on{background:var(--surface2)}
.bom tbody tr.on td:first-child{font-weight:700;color:var(--head);box-shadow:inset 3px 0 0 var(--dim)}
.bom .grain{color:var(--ink3);font-size:12px}
.bom tfoot td{color:var(--ink2);font-size:12px;border-bottom:0}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--head);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:0;width:min(720px,92vw)}
/* 판 머리에 늘 보이는 나가기 — 굴려도 따라온다.
   관계제어판은 `.dlg` 가 굴러가는 칸이다(속 3,887px / 보이는 593px). 그래서 맨 아래 「닫기」 가
   y3,927 에 있어 한참 굴려야 나왔다 — 사장님이 「나가기 버튼 없어요」 하신 자리다. */
.dlg.rdlg{padding-top:0}                 /* 머리가 맨 위에 딱 붙게 — 위에 틈이 있으면 글이 그 틈으로 비친다 */
.dlghead{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 -20px 0;padding:14px 10px 10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.dlghead h3{margin:0}
.dlgx{flex:none;width:44px;height:44px;padding:0;border:0;background:transparent;border-radius:50%;
  font-size:20px;line-height:1;color:var(--ink3)}
.dlgx:hover{background:var(--fill2);color:var(--head)}
dialog::backdrop{background:rgba(17,17,16,.4)}
.dlg{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--head)}
.dlg p{margin:0;color:var(--ink2);font-size:13px}
.dlg textarea{width:100%;height:240px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:12px 14px;resize:vertical}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
#warnDlg{width:min(420px,92vw)}
#warnDlg .row button{min-height:44px;padding:11px 24px}
#warnDlg p{font-size:14px;line-height:1.55;color:var(--ink)}
@media (max-width:1100px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(380px,60vh) minmax(380px,60vh);grid-template-areas:"head" "params" "view3d" "draw"}
  .params{padding-bottom:18px}.stats{margin-top:4px}
  /* 폰에서 3D 를 만지고 손을 떼면 설정 칸이 접히고 3D 가 커진다. 다시 펴는 단추는 접힌 자리에 선다. */
  .app.집중{grid-template-rows:auto auto minmax(380px,84vh) minmax(380px,60vh)}
  .params.접힘{padding:0;gap:0;overflow:hidden}
  .params.접힘>*:not(.파람바){display:none}
  .params.접힘 .파람바{display:flex}
}
.파람바{display:none;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;
  border:0;border-radius:0;border-bottom:1px solid var(--line2);background:var(--surface);
  font-weight:700;color:var(--ink2);letter-spacing:.02em}
.파람바:hover{background:var(--surface2)}
.파람바::after{content:"▾"}
/* 인쇄 — 도면 칸만 나간다. 쪽 하나가 A4 한 장이다. */
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{height:auto;background:#fff}
  .app{display:block;background:#fff;gap:0;min-height:0}
  .app>*:not(.draw){display:none}
  .draw{display:block;min-height:0}
  .draw .panelhead{display:none}
  #svgwrap{display:block;overflow:visible;padding:0}
  .pagebox{display:block;overflow:visible;container-type:normal}
  #pageBox>.page,#pageBox>.page:not(.보는쪽){display:block;width:210mm}
  #pageBox>.page.p1{display:flex}
  .thumbs{display:none}
  .svgwrap{overflow:visible;padding:0;flex:none}
  .svgwrap .page{width:210mm;height:297mm;aspect-ratio:auto;margin:0;border:0;break-after:page;page-break-after:always}
  .svgwrap .page:last-child{break-after:auto;page-break-after:auto}
  .pg .t1{font-size:4.6px}.pg .t2{font-size:3.2px}.pg .t3{font-size:2.8px}.pg .t4{font-size:2.6px}.pg .t5{font-size:2.3px}.pg .tv{font-size:2.9px}
  .svgwrap .toc b{font-size:8pt}.svgwrap .toc>div{font-size:9.5pt}
}
/* 넓은 화면에서는 한 화면 안에 다 넣는다. 칸마다 제 안에서 굴린다 —
   왼쪽 설정이나 오른쪽 도면이 길어져도 3D 칸이 따라 늘어나지 않는다. */
@media (min-width:1101px){
  .app{height:100vh}
  .app>*{min-height:0}
  .draw{min-height:0}
}
/* 모드에 따라 칸을 다시 나눈다 — 숨은 칸 자리를 남은 칸이 실제로 가져간다 */
@media (min-width:1101px){
  .app.m3d{grid-template-columns:284px minmax(0,1fr);grid-template-areas:"head head" "params view3d";
    grid-template-rows:auto minmax(440px,1fr)}
  /* 2D 모드는 도면을 보러 들어간 자리다. 부품표 칸이 빠진 자리를 도면이 통째로 가져간다(10-01 사장님 말씀). */
  .app.m2d{grid-template-columns:284px minmax(0,1fr);grid-template-areas:"head head" "params draw";
    grid-template-rows:auto minmax(440px,1fr)}
}
@media (max-width:1100px){
  .app.m3d{grid-template-rows:auto auto minmax(380px,60vh);grid-template-areas:"head" "params" "view3d"}
  .app.m2d{grid-template-rows:auto auto minmax(380px,84vh);grid-template-areas:"head" "params" "draw"}
}
/* 10-03 사장님 말씀 — 「모바일에서 … 화면이 좌우여유 유격이 있어서 화면 조정이 힘들다 화면유격이 없게 해줘」.
   폰에서만 **좌우** 여백을 0 으로 둔다. 위아래는 한 톨도 안 건드린다(사장님이 「좌우」 라 하셨다).
   ⚠ 넓은 화면(≥1101px)은 세 칸으로 갈라져 있어 여백이 있어야 읽힌다 — 그래서 `@media` 안이다.
   ⚠ `#svgwrap` 은 **아이디로** 적는다 — 245줄의 `#svgwrap{padding:10px}` 을 이겨야 하고,
      `.svgwrap` 으로 적으면 같은 클래스를 쓰는 **큰그림(`.zoomwrap`)** 까지 끌려 들어간다(§4.75). */
@media (max-width:1100px){
  header{padding-left:0;padding-right:0}
  /* ⚠ `overflow-x:hidden` 은 여백을 걷었기 때문에 **같이 필요한 것**이다 — 내가 판단으로 더 한 것이다.
     × 의 닿는 자리(`.two .x::after` 40px · §4.9866)가 20px 단추 가운데에 걸려 **좌우로 10px 씩 비어져 나간다.**
     전에는 오른 여백 20px 안에 묻혀 안 보였는데, 0 이 되니 `.params` 가 **가로로 10px 굴러간다**
     (잰 값: `scrollWidth 385 / clientWidth 375` · `::after` 를 끄면 375). 사장님 말씀이 「화면 조정이 힘들다」 인데
     가로 굴림이 생기면 더 나빠진다. **닿는 자리는 한 픽셀도 안 깎았다** — 화면 밖으로 나간 쪽만 안 그린다.
     되돌리면 이 한 줄이고, 그때 가로 굴림 10px 이 도로 생긴다. */
  .params{padding-left:0;padding-right:0;overflow-x:hidden}
  #svgwrap{padding-left:0;padding-right:0}
}
/* ── 10-03 사장님 말씀 — 「이런 도면조절 옵션들 모바일에서는 도면 밖으로 빼야지 이게뭐냐 화면 다가리고」 ──

   도구줄 · 시점줄 · 숨김바 · 분해도. **아무것도 없애지 않았다. 자리만 옮긴 것이다** — 닿는 자리 44px 그대로다.

  /* 10-01 사장님 말씀: 「하판 옵션 측판사이 일때 하판의 전면부는 **측판과 맞는게 기본세팅** 입니다. 이는 상판의

     측판사이 옵션시 **하판유격** 옵션이 생성되어 **측판의 안쪽으로 0.5mm단위로 줄어들게** 할 수 있어야 합니다」.
     그래서 **하판 앞면 = 측판 앞면(`측깊들`) + 하판유격** 이다 — 측판이 물러나면 하판이 따라간다.
     갈래를 둘로 나누지 않는다 — 상판이 측판 사이면 `측깊들` 이 0 이라 저절로 하판유격만 먹는다.
     「측판 아래」 는 하판이 측판을 받치는 자리라 사장님 말씀(「측판사이 일때」) 밖이다 — 앞면 0 그대로다. */
  const 하깊들 = 아래덮 ? 0 : 규칙.하판유격;
  /* 하판커버면 밴드가 앞을 막으니 하판은 **밴드 뒤**에서 시작한다 — 깊이가 밴드 두께만큼 줄어든다.
     ⚠ 10-03 사장님 판정 「**전면밴드는 측판보다 앞설 수 없어**」 로 밴드 앞면이 `측깊들` 이 되었다(아래 전면밴드 줄).
     **그래서 여기도 `측깊들` 을 같이 더해야 한다** — 안 더하면 밴드 뒤와 하판 앞이 `측깊들` 만큼 겹친다.
     겹친 판은 도면에 안 보이고 현장에서 안 들어간다. **두 줄은 한 벌이다. 따로 고치지 마라.** */
  const 하판앞 = 아래덮 ? 0 : (커버 ? 측깊들 + Tplinth : 측깊들 + 하깊들), 하깊 = CD - 하판앞;
  add('하판', bx, 하판앞, bz, bwid, 하깊, Tbot, [0,0,-1], {L:bwid, W:하깊, T:Tbot, grain:'가로'});
  const innerH = 상판밑 - (bz + Tbot);
  // 선반은 두 갈래다. 고정 선반은 측판에 체결해 박히고, 이동 선반은 체결 없이 철물 위에 얹힌다.
  // 얹히는 것이라 좌우로 조금 작게 짜는 집이 있어 그 값을 규칙에 두었다(기본 0 — 안 건드리면 예전과 같다).
  // 그 품목에 이동선반이 발생하지 않으면 **셈에서만 0 단으로 본다** (담긴 shelvesM 은 안 지운다).
  const 이동단 = 품목밖('이동선반', s.품목) ? 0 : shelvesM;
  const 단수 = shelves + 이동단;
  const pitch = (innerH - shelves*Tshelf - 이동단*Tshelf2) / (단수 + 1);
  // 인도어는 도어가 몸통 앞면 안쪽(y 0~Tdoor)에 앉아 선반과 겹친다. 겹치는 만큼 선반을 뒤로 물리고
  // 깊이를 줄인다 — 재단 치수(cut.W)도 같이 줄어든다. 겹치는 부속은 선반뿐임을 설정 8748가지로 확인했다.
  const 도어물림 = (doors > 0 && s.doorMode === 'in' && 규칙.인선반줄임) ? Tdoor : 0;
  const 선반깊이 = 선반끝 - 도어물림;
  /* ───────── 도어 칸은 **선반보다 먼저** 잡는다 (10-05) ─────────
     사장님 말씀: 「**가로대의 기본 위치는 마이다와 마이다 사이에 가로대의 정 중앙 선이 오는 위치**로해줘」.
     가로대가 마이다 틈을 봐야 하므로 **셈만** 위로 올렸다.
     ⚠ **세우는 자리(`add`)는 한 줄도 안 옮겼다** — 조각 차례가 바뀌면 짝 열쇠(§4.865)가 통째로 어긋난다.
     그래서 여기서는 값만 내고, 도어는 예전 그 자리에서 선다. */
  let 앞으로 = 0;                            // 도어가 몸통 앞으로 나온 길이 (도면 치수선이 쓴다)
  /* 10-02 사장님 말씀: 「**서랍장 품목의 도어의 명칭은 마이다 입니다. 마이다는 8개까지 분할이 가능하며
     분할시 현재 설정된 도어의 높이에서 각 분할 마이다 간 4mm의 빈공간이 생기며 동일사이즈로 분할** 되게
     해주세요. 도어의 인도어 아웃도어 와 **동일 개념의 외부/내부** 선택이 가능하게 해주세요」.
     - 수납장 문짝은 **좌우로** 나뉘고(0·1·2), 서랍장 마이다는 **위아래로** 나뉜다(0~8).
     - 4mm 는 이미 쓰고 있는 `규칙.도어사이`(기본 4) 그대로다 — 같은 뜻이라 값을 새로 만들지 않았다.
     - 담는 열쇠도 `state.doors` 그대로다. **수납장은 셈에서 2 를 넘지 않게 본다**(단추가 0·1·2 뿐이다) —
       담긴 숫자는 안 지운다(§4.9875 와 같은 길). `state` 가 품목마다 갈라지면 이 한 줄은 없어도 된다. */
  const 도어명 = 부속이름('문짝', s.품목), 세로분할 = 도어명 === '마이다';
  const 서랍칸 = [];                           // 마이다마다 [아랫끝 z, 높이] — 아래 서랍이 이것을 쓴다
  const 문수 = Math.min(doors, 세로분할 ? 8 : 2);
  /* 10-06 사장님 말씀 — 마이다의 「측판유격」. **마이다를 좌우로 안쪽으로만 민다**(음수로 측판 밖을 못 나간다).
     **실제로 먹은 값을 따로 들고 있는다** — 아래 서랍이 **같은 값만큼** 같이 들어가기 때문이다
     (「마이다의 이동에 맞춰 서랍이 이동하며 … 서랍재의 사이징에 영향이 가야 합니다」).
     ⚠ **칸을 다 먹지 않게 셈에서만 붙잡는다** — 담긴 숫자는 그대로 둔다(§4.9899 의 그 길). */
  let 마이다민 = 0;
  let 도어칸 = null;
  if (문수 > 0){
    const n = 문수, gap = 규칙.도어사이;
    let x0, x1, z0, z1, dy;
    if (s.doorMode === 'in'){                // 인도어 — 몸통 안. 다는 쪽 2mm, 맞닿는 나머지 면 3mm
      // 사장님 말씀(09-28): 「이 옵션은 삭제해주고 관련 로직도 모두 삭제해줘」 — 좌·우 고르개를 없앴다.
      // 재 보니 좌·우는 **재단 치수를 하나도 안 바꾸고** 자리만 1mm 옮겼다. 그래서 예전 기본값(좌)만 남긴다.
      const 왼 = 규칙.인경첩, 오 = 규칙.인나머지;
      x0 = 안왼 + 왼; x1 = 안오 - 오;
      // 10-02 사장님 말씀: 「도어옵션에 도어의 상 하부 유격높이를 조정하는 옵션을 만들어 주세요」.
      // 전에는 위·아래가 `인나머지`(좌우와 한 값)에 묶여 있어 위만 따로 못 고쳤다. 열쇠를 갈랐다 —
      // `인나머지` 는 이제 **경첩 반대쪽(좌우)만** 잰다. 기본값이 셋 다 3 이라 도면은 한 톨도 안 바뀐다.
      z0 = bz + Tbot + 규칙.인아래; z1 = 상판밑 - 규칙.인위;
      dy = 0;                                // 몸통 앞면 안쪽에 앉는다
    } else {                                 // 아웃도어 — 몸통 외경에서 좌우·위 2mm, 아래는 전면밴드와 만나 5mm
      x0 = 규칙.아웃좌우; x1 = W - 규칙.아웃좌우;
      z0 = bz + (걸레높이 > 0 ? 규칙.아웃아래걸레 : 규칙.아웃아래없음); z1 = H - 규칙.아웃위;
      // 사장님 말씀(09-28): 「아웃도어시 도어는 몸통과 완전히 붙은게 아닌 **2mm 의 경첩유격**이 있게 기본설정」.
      // 그래서 몸통 앞면에서 `아웃경첩` 만큼 띄우고 그 앞에 도어를 세운다. 도어 재단 치수는 안 바뀐다.
      dy = -(Tdoor + 규칙.아웃경첩); 앞으로 = Tdoor + 규칙.아웃경첩;   // 몸통 앞으로 나온 길이 = 유격 + 두께
    }
    // 10-06 — 마이다만 좌우로 안쪽으로 민다. 수납장 문짝은 `세로분할` 이 거짓이라 한 톨도 안 바뀐다.
    if (세로분할 && 규칙.마이다측판유격 > 0){
      마이다민 = Math.max(0, Math.min(규칙.마이다측판유격, (x1 - x0 - 1) / 2));
      x0 += 마이다민; x1 -= 마이다민;
    }
    // 마이다는 폭을 다 쓰고 **높이**를 고르게 나눈다 — 문짝은 높이를 다 쓰고 **폭**을 나눈다.
    const dw = 세로분할 ? (x1 - x0) : (x1 - x0 - (n-1)*gap) / n;
    const dh = 세로분할 ? (z1 - z0 - (n-1)*gap) / n : (z1 - z0);
    도어칸 = { n, gap, x0, z0, dy, dw, dh };
  }
  /* 마이다와 마이다 사이 **틈의 한가운데** — 아래에서부터 차례로. 마이다가 둘 미만이면 틈이 없어 빈 배열이다.
     **문짝(수납장)은 좌우로 나뉘므로 틈이 가로라 여기 안 들어간다** — 그래서 수납장은 한 톨도 안 바뀐다. */
  const 마이다틈 = [];
  if (도어칸 && 세로분할)
    for (let k = 1; k < 도어칸.n; k++) 마이다틈.push(도어칸.z0 + k*도어칸.dh + (k - 0.5)*도어칸.gap);
  /* 틈과 가로대를 짝짓는다 — **차례대로 하나씩** 맞추면 수가 다를 때 선반끼리 **서로 넘어가 겹친다**
     (마이다 2 · 가로대 3 에서 첫째가 941.5 로 올라가 둘째 940 을 넘어섰다 — 재서 잡았다).
     그래서 §4.9879 의 **가운데 맞춤**(Bresenham)을 그대로 쓴다 — 적은 쪽을 많은 쪽에 고르게 흩어
     짝짓는 것이라 **차례가 안 뒤집히고 한 틈에 둘이 안 들어간다.**
     틈이 더 많으면 가로대마다 틈을 고르고, 가로대가 더 많으면 **틈마다 가로대를 고른다** —
     못 고른 가로대는 **예전 자리(고른 나눔) 그대로**다. 수량은 사장님이 정하신다. */
  const 틈배정 = [];
  if (마이다틈.length && shelves > 0){
    const G = 마이다틈.length, N = shelves;
    if (G >= N) for (let i = 0; i < N; i++) 틈배정[i] = 마이다틈[Math.round((i + 0.5) * G / N - 0.5)];
    else for (let j = 0; j < G; j++) 틈배정[Math.round((j + 0.5) * N / G - 0.5)] = 마이다틈[j];
  }
  /* 10-02 사장님 말씀: 「이동선반의 기본 생성 위치는 설정된 고정 선반의 **적절한 사이 사이** 로 해주세요」.
     전에는 `i >= shelves` 라 아래에 고정이 몰리고 위에 이동이 몰렸다. 이제 **고르게 흩어** 놓는다.
     자리 하나하나를 고르는 자 — `j` 번째 이동선반은 `round((j+0.5)·N/M − 0.5)` 번 자리에 선다.
     양 끝에 반 칸씩 남기고 가운데를 고르게 가른다(Bresenham 의 가운데 맞춤).
     **칸 나눔(`pitch`)은 한 글자도 안 건드렸다** — 고정·이동을 합쳐 고르게 나누던 그대로다.
     M = 0 이거나 M = N 이면 집합이 비거나 다 차서 **고치기 전과 한 톨도 같다.** */
  const 이동자리 = new Set();
  for (let j = 0; j < 이동단; j++) 이동자리.add(Math.round((j + 0.5) * 단수 / 이동단 - 0.5));
  /* 옮길 자리를 **미리 다 셈해 둔다** — 옆 선반을 넘는 것은 안 옮긴다.
     칸이 좁고 선반이 두꺼우면(H900 · 마이다 2 · 가로대 8 · 55T 따위) 틈이 제 자리에서 멀어
     **옮기다 옆 선반을 타 넘는다** — 재서 잡았다(차례깨짐 210 · 가로대끼리 겹침 204).
     그래서 **앞 선반의 최종 윗면과 뒤 선반의 예전 아랫면 사이에 들 때만** 옮긴다.
     못 들면 **예전 자리(고른 나눔) 그대로** 둔다 — 자리를 억지로 만들지 않는다.
     앞을 최종으로, 뒤를 예전 것으로 재므로 **차례가 뒤집히는 일이 없다**(앞에서부터 차례로 정해진다). */
  const 놓을자리 = [];
  {
    let zz = bz + Tbot, 앞윗면 = bz + Tbot, 고정수 = 0;
    const 예전 = [];
    for (let i = 0; i < 단수; i++){
      const t = 이동자리.has(i) ? Tshelf2 : Tshelf;
      zz += pitch; 예전.push({ z:zz, t }); zz += t;
    }
    for (let i = 0; i < 단수; i++){
      const { z, t } = 예전[i];
      let 놓을 = z;
      if (!이동자리.has(i)){
        const 가운데 = 틈배정[고정수];
        if (가운데 !== undefined){
          const 새 = 가운데 - t/2;
          const 위한계 = (i + 1 < 단수) ? 예전[i + 1].z : bz + Tbot + innerH;
          if (새 >= 앞윗면 - 1e-9 && 새 + t <= 위한계 + 1e-9) 놓을 = 새;
        }
        고정수++;
      }
      놓을자리.push(놓을); 앞윗면 = 놓을 + t;
    }
  }
  // 이동 선반은 넣고 뺄 여유가 있어야 하므로 좌우로 한 쪽씩, 뒤로 한 번 물려 짠다.
  let 선반z = bz + Tbot;
  let 고정번째 = 0;                          // 몇 번째 고정선반(가로대)인가 — 마이다 틈과 짝지을 때 쓴다
  const 고정센터 = [];                       // 밴드 「중」 이 이 높이에 맞춰 선다
  const 고정선반자리 = [];                   // [아랫면, 윗면] — 밴드를 끌 때 걸리는 자리가 된다
  for (let i = 0; i < 단수; i++){
    const 이동 = 이동자리.has(i);
    const t = 이동 ? Tshelf2 : Tshelf;
    /* 10-03 사장님 말씀 — 「서랍장의 가로대는 깊이를 입력하는 방식이고 **선반유격은 필요없는 옵션**이야
       가로대의 깊이 입력시 입력한 깊이의 가로대가 되어 **마이다의 안쪽에 붙는다**」.
       그 품목의 고정선반이 깊이 입력 갈래면 **「선반유격」 을 셈에서 0 으로 본다**(칸이 안 보이므로 · §4.9899).
       앞자리는 `도어물림` 그대로다 — **그것이 마이다 안쪽면**이다. */
    const 깊이갈래 = !이동 && 깊이입력인가('고정선반', s.품목);
    // 선반은 측판 깊이보다 이만큼 앞에서 들어간다 (09-28 사장님 말씀 · 고정·이동 따로).
    const 들임 = 이동 ? 규칙.이동선반들임 : (깊이갈래 ? 0 : 규칙.고정선반들임);
    const 옆 = 이동 ? 규칙.이동좌우 : 0, 앞 = (이동 ? 규칙.이동앞뒤 : 0) + 들임;
    // 깊이 입력 갈래에서 값이 0 이면 **자동** — 전처럼 안쪽 끝까지다.
    const 깊이 = (깊이갈래 && 규칙.가로대깊이 > 0) ? 규칙.가로대깊이 : 선반깊이 - 앞;
    선반z += pitch;
    /* 10-05 사장님 말씀 — 「**가로대의 기본 위치는 마이다와 마이다 사이에 가로대의 정 중앙 선이 오는 위치**로해줘」.
       마이다 틈이 있으면 **아래에서부터 차례로** 그 틈 한가운데에 **중앙선**(`z + t/2`)을 맞춘다.
       그래서 두께를 바꿔도 중앙선은 그 자리다 — 윗면·아랫면이 아니라 가운데를 잡기 때문이다.
       짝짓기와 옮길 자리는 위 `틈배정`·`놓을자리` 가 미리 정한다 — 수가 달라도 차례가 안 뒤집히게.
       ⚠ `선반z` 는 옮기든 말든 **예전 그대로 나아간다** — 안 옮기는 선반 자리가 한 톨도 안 움직이게 하려는 것이다. */
    const 놓을z = 놓을자리[i];
    // 앞쪽에서 뺀다 — 뒤는 뒷판에 붙고 앞이 트여야 손으로 들어낼 수 있다
    add(이동 ? '이동선반' : 부속이름('고정선반', s.품목), 안왼 + 옆, 도어물림 + 앞, 놓을z,
        안폭 - 2*옆, 깊이, t, [0,-0.55,0], {L:안폭 - 2*옆, W:깊이, T:t, grain:'가로'});
    if (!이동){ 고정센터.push(놓을z + t/2); 고정선반자리.push([놓을z, 놓을z + t]); 고정번째++; }
    선반z += t;
  }
  /* 전면밴드 — 10-01 사장님 말씀 둘을 **한 줄**로 받는다(관리자가 읽은 뜻이다).
     「전면밴드유격 … 측판안으로 0.5mm 단위로 들어가 위치」 + 「기본위치는 **하판의 유격 세팅에 맞춰** 변경」
     → **재는 자리를 몸통 앞면(0)에서 `하판 앞면` 으로 옮긴다.**

     하판유격을 고치면 전면밴드가 **따라 움직이고**, 측판 앞면보다 늘 안쪽이라 「측판 안으로」 도 지켜진다.
     **기본값 30 은 그대로다** — 하판유격·측판 들임이 0 이면 예전 그 자리(y 30)에 선다.
     ⚠ **키는 `plinth` 가 아니라 하판 밑면 `bz` 다 — 사장님이 시키신 것이 아니라 관리자가 두기로 한 것이다.**
     「하판 올림」 으로 하판이 올라가면 전면밴드가 따라 올라가 틈이 안 생긴다(재서 0 을 봤다).
     하판 올림 0 이면 `bz = 걸레높이` 라 예전과 한 톨도 같다.
     10-02 — 하판커버에서는 **앞을 막는 것이 이 꼴의 뜻**이라 `전면밴드유격`(앞뒤)을 안 쓰고 **앞면에 딱 선다**.
     키도 `bz` 가 아니라 `밴드키` 다 — 하판만 내려가고 밴드는 사장님이 넣으신 그대로 선다.
     ⚠ 10-03 사장님 판정: 「**전면밴드는 측판보다 앞설 수 없어**」. 그래서 그 「앞면」 은 몸통 맨 앞(0)이 아니라
     **측판 앞면(`측깊들`)** 이다. 전에는 `0` 이라 `측판깊이들임` 을 켠 만큼 밴드가 측판보다 앞섰다(§4.9871-밴드꼴).
     **꼴의 뜻은 그대로다 — 앞을 막는 자리만 측판에 맞춘 것이다.** 바로 위 `하판앞` 과 한 벌이니 같이 본다. */
  if (걸레높이 > 0) add('전면밴드', 안왼, 커버 ? 측깊들 : 하판앞 + 규칙.전면밴드유격, 0, 안폭, Tplinth, 밴드키, [0,-0.8,-0.5],
                        {L:안폭, W:밴드키, T:Tplinth, grain:'가로'});
  // 뒷판. 끼우기면 통 내부보다 가로·세로로 「뒷판키움」 만큼 크게 짜서 홈에 물린다.
  if (끼움){
    const 키 = 규칙.뒷판키움, bw = 안폭 + 키, bh = innerH + 키;
    add('뒷판', 안왼 - 키/2, 홈뒤 - TB, bz + Tbot - 키/2, bw, TB, bh, [0,1,0], {L:bh, W:bw, T:TB, grain:'세로'});
  } else {
    // 덮기 — 사장님 말씀(09-16): 상판 끝에서 2mm 내려오고, 양 측판 끝에서 2mm 씩 들어가고,
    // 하판 바닥(= 하판 밑면 bz)에서 2mm 올라간다. 그만큼 전면밴드 뒤가 트인다.
    const 물 = 규칙.뒷판물림;
    const bx0 = 물, bw = W - 2*물, bz0 = bz + 물, bh = (H - 물) - bz0;
    add('뒷판', bx0, CD, bz0, bw, TB, bh, [0,1,0], {L:bh, W:bw, T:TB, grain:'세로'});
  }
  /* 10-05 사장님 말씀 — 「**서랍장 품목 분해시 서랍과 마이다는 체결이 되어 있는 상태로 도면의 좌측으로
     현재 간격 유지하면서 빠져나오도록**해줘 … 몸통의 분해 모습이 보이고 서랍과 마이다는 **구조변경없이
     현 배가모양 고대로** 몸통에서만 빠져나오는 모양새」.
     분해도는 `applyExplode()` 가 조각마다 `dir × e` 만큼 미는 것이다. 그러니 **한 덩어리로 두는 길은
     그 덩어리의 `dir` 을 다 똑같이 두는 것** 하나뿐이다 — 같은 값이면 다 같은 거리를 가므로
     **서로의 상대 자리가 한 톨도 안 바뀐다**(마이다끼리의 틈도, 서랍과 제 마이다의 자리도).
     **왼쪽은 −X 다**(측판 왼짝이 `[-1,0,0]` 인 그 축).
     ⚠ 크기는 **셈해서 낸다**(10-06 사장님 말씀: 「분해된 측판과 겹치지 않도록 서랍부를 더 멀리」).
     **1.7 로는 어떤 분해 값에서도 왼 측판이 서랍 덩어리 **속**에 박혀 있었다**(겹침 18mm = 측판 두께 · 재서 잡았다) —
     덩어리가 몸통만큼 넓어서 1.7 과 1 의 차(0.7·e)로는 몸통 폭 `W` 를 못 넘기 때문이다.
     그래서 **슬라이더 절반(0.5)에서 덩어리 오른끝이 왼 측판 왼끝을 60mm 지나도록** 거꾸로 푼 값이다 —
       `(크기 − 1) × (0.5 × max(H,W) × 0.28) = W + 60`
     `applyExplode` 의 `e` 식(`max(H,W) × 0.28`)을 그대로 뒤집은 것이라 **어떤 치수에서도 절반에서 빠져나온다.**
     기본값에서 **4.41** 이고, 분해 0 이면 `dir × 0` 이라 **고치기 전과 한 톨도 같다.**
     ⚠ **이 한 값을 다섯 곳이 함께 쓴다. 따로 적지 마라** — 하나만 달라도 덩어리가 찢어진다.
     ⚠ 분해도는 **보기만**이다. 부속서는 그대로 서랍재W·서랍재D·서랍바닥 셋이 따로 나온다(§4.9855). */
  const 왼덩이 = [-(1 + (W + 60) / Math.max(1, Math.max(H, W) * 0.28 * 0.5)), 0, 0];
  // 도어 — **셈은 위에서 끝났고 여기서는 세우기만 한다**(10-05 · 조각 차례를 지키려고).
  if (도어칸){
    const { n, gap, x0, z0, dy, dw, dh } = 도어칸;
    for (let k = 0; k < n; k++){
      add(도어명, 세로분할 ? x0 : x0 + k*(dw+gap), dy, 세로분할 ? z0 + k*(dh+gap) : z0,
          dw, Tdoor, dh, 세로분할 ? 왼덩이 : [0,-1.7,0], {L:dh, W:dw, T:Tdoor, grain:'세로'});
      // 인도어 ↔ 아웃도어 로 바꾸면 문짝 자리(x,y,z)가 통째로 달라진다. 자리 열쇠만 쓰면
      // 한쪽에서 숨기거나 지운 것이 다른 쪽에서 되살아나고 되돌아오면 또 사라진다
      // — 사장님 말씀(09-22) 「아웃도어 선택시 도어 자체가 사라진다」 가 이것이다.
      // 그래서 짝 번호로 붙잡는 열쇠를 따로 붙인다(밴드의 단 열쇠와 같은 길).
      parts[parts.length-1].단열쇠 = `${도어명}@짝:${k}`;

      // `k` 는 아래에서 위로 도는 그 차례라 **0 이 제일 아래 칸**이다. 치수는 한 톨도 안 쓴다.
      if (세로분할) parts[parts.length-1].서랍번호 = k;
      /* 10-06 사장님 말씀 — 「수납장 품목의 동작의 경우 **양쪽 도어가 열리는 모습**을 보여주면 되는데
         **기본 110** 열리는 모습을 보여주면 됩니다」(§4.9850-도어).
         두 짝이면 **바깥으로 열리게** 왼짝은 왼끝, 오른짝은 오른끝에 경첩이 선다. 한 짝이면 왼끝이다
         (이 집은 경첩이 「좌」 하나다 · §4.94). 서랍장 마이다는 서랍이라 안 붙인다. */
      if (!세로분할) parts[parts.length-1].경첩 = (n === 1 || k === 0) ? 'L' : 'R';
      if (세로분할) 서랍칸.push([z0 + k*(dh+gap), dh]);        // 10-05 — 마이다마다 서랍 하나
    }
  }
  /* ───────── 서랍 (10-05 사장님 말씀) ─────────
     「서랍장 상태에서 발생되는 기본 부속에 서랍이 있어야 합니다. 서랍은 **각 마이다의 하부 끝에서 21mm 올라간
     지점 부터** 위치하며 좌우 양 끝은 **측판으로부터 13mm씩** 공간이 생기도록 사이징된다 - 이공간은 측판과 서랍
     사이에 **볼레일 철물**이 들어가야 하는 여유공간이다. 서랍의 기본높이는 마이다의 총높이에서 **하부 21mm
     상부 21mm 제외**한 사이즈 … 서랍의 기본 소재의 두께는 **12mm** 이며 … **서랍재W**(넓이를 결정) ·
     **서랍재D**(폭을 결정) 부속들로 구성된다. 조립방식은 서랍의 **좌우에 서랍재D**가 양쪽에 위치하면 그 사이로
     **서랍재W 2개가 각각 전면 후면**에 배치된다 … 바닥판은 … **뒷판과 같은 원리**로 끼우기/덮기 … **서랍재의
     바닥으로 부터 20mm** 지점에서 홈가공이 시작 … **- 50mm의값**」

        해당 서랍을 구성하는 서랍재는 나타나야 하며」. 그래서 **세 부속만** 선다. 이름을 세우면 부속서에 뜬다.
     ⚠ **실제 내부깊이는 새로 셈하지 않는다 — `선반깊이` 가 이미 그것이다.** 사장님 예시의
        「측판이 480이고 마이다가 측판을 침범하지 않는 옵션이라면 480-우라홈가공(20mm), 마이다가 측판안으로
        들어오면 480-마이다두께-우라홈(20mm)」 이 곧 `선반끝(= D − 우라홈) − 도어물림(= 마이다 두께)` 이다.
        베끼지 말고 그 값을 쓴다(관리자) — 안 그러면 우라홈을 고칠 때 두 자리가 어긋난다. */
  if (!품목밖('서랍재W', s.품목) && 서랍칸.length){
    const 레일 = 규칙.서랍레일, 위틈 = 규칙.서랍위유격, 아래틈 = 규칙.서랍아래유격;
    /* 10-06 사장님 말씀 — 「**마이다의 이동에 맞춰 서랍이 이동하며 이 서랍의 이동에 따라 서랍재의
       사이징에 영향이 가야 합니다**」. 그래서 서랍이 **마이다가 들어간 그 값만큼(`마이다민`) 같이** 들어간다.

          그래서 **둘이 같은 틈을 두 번 먹지 않는다** — 측판에서 서랍까지가 `레일 + 측판유격` 이 된다.
       ⚠ 서랍재W 길이 · 서랍바닥 폭은 **다 `서랍폭` 에서 나온다** — 한 자리를 고치면 다 따라온다. */
    const 서랍폭 = 안폭 - 2*레일 - 2*마이다민;           // 측판 안쪽면에서 좌우로 레일 자리 + 측판유격만큼 띄운다
    const 서랍깊 = 선반깊이 - 규칙.서랍깊이줄임;         // 실제 내부깊이 − 50
    const sx = 안왼 + 레일 + 마이다민, sy = 도어물림;    // 앞면은 마이다 안쪽면 — 가로대와 같은 자리다
    const Tsw = s.Tsw, Tsd = s.Tsd, Tsb = s.Tsb;
    const 바닥끼움 = s.서랍바닥꼴 === 'insert';
    // 홈은 뒷판 것을 그대로 쓴다 — 폭 = 바닥판 두께 + 홈유격 · 깊이 = 홈깊이.
    // 시작점은 **서랍재 바닥에서** 재므로 뒷판(뒤 마감에서 재는 우라홈)의 거울이다.
    const s홈폭 = Tsb + 규칙.홈유격;
    const s홈 = 바닥끼움 ? { 깊이:규칙.홈깊이, 폭:s홈폭, 시작:규칙.서랍홈시작 } : null;
    const s홈글 = s홈 ? `홈 ${fmt(s홈.깊이)}×${fmt(s홈.폭)}` : '';
    const 재컷 = (L, 키, T) => ({L, W:키, T, grain:'가로', 비고:s홈글, 서랍홈:s홈});
    /* 10-05 사장님 말씀 — 「서랍재는 분해하지 않고 **서랍의 조립된 모습**을 보여줘」,
       그리고 같은 날 **「서랍과 마이다는 체결된 채 도면의 좌측으로 … 현 배가모양 고대로」**(나중 말씀이 이긴다).
       그래서 **마이다와 똑같은 `왼덩이`** 를 쓴다 — 같은 값이라 같은 거리를 가고,
       서랍끼리도 서랍↔마이다도 **상대 자리가 한 톨도 안 바뀐 채** 통째로 왼쪽으로 나간다.
       ⚠ **보이는 것만의 이야기다.** `dir` 은 분해도와 측판 홈 면 가르기에만 쓰이고
       부속서·부품표·재단은 한 글자도 안 본다 — **서랍재는 부속서에 그대로 따로따로 나온다**(관리자가 못 박았다). */
    const 안흩어짐 = 왼덩이;          // 마이다와 **같은 값** — 그래서 한 덩어리로 같이 나간다
    if (서랍폭 > 0 && 서랍깊 > 0 && 서랍폭 - 2*Tsd > 0 && 서랍깊 - 2*Tsw > 0) 서랍칸.forEach(([mz, mh], 칸번째) => {
      const 서랍키 = mh - 위틈 - 아래틈;
      if (!(서랍키 > 0)) return;
      const 처음조각 = parts.length;                     // 10-06 — 이 칸의 서랍재에 같은 번호를 붙일 자리
      const z0 = mz + 아래틈;                           // 마이다 하부 끝에서 올라간 지점
      // 좌우 — 서랍재D 두 장. 길이가 서랍의 앞뒤(폭)를 결정한다.
      add('서랍재D', sx,                 sy, z0, Tsd, 서랍깊, 서랍키, 안흩어짐, 재컷(서랍깊, 서랍키, Tsd));
      add('서랍재D', sx + 서랍폭 - Tsd,  sy, z0, Tsd, 서랍깊, 서랍키, 안흩어짐, 재컷(서랍깊, 서랍키, Tsd));
      // 전후 — 서랍재W 두 장. **두 서랍재D 사이로** 들어가므로 길이가 그만큼 짧다.
      const ww = 서랍폭 - 2*Tsd;
      add('서랍재W', sx + Tsd, sy,                 z0, ww, Tsw, 서랍키, 안흩어짐, 재컷(ww, 서랍키, Tsw));
      add('서랍재W', sx + Tsd, sy + 서랍깊 - Tsw,  z0, ww, Tsw, 서랍키, 안흩어짐, 재컷(ww, 서랍키, Tsw));
      // 바닥판 — 뒷판과 같은 원리다. 끼우기면 안쪽 칸보다 「뒷판키움」 만큼 크게 짜서 홈에 물리고,
      // 덮기면 서랍 바깥 네모에서 「뒷판물림」 만큼 들어가 **밑면에 덧붙는다**(뒷판 덮기의 거울).
      if (바닥끼움){
        const 키움 = 규칙.뒷판키움;
        const bz0 = z0 + s홈.시작 - s홈.폭;             // 홈의 바깥 벽 — 뒷판을 홈 뒤쪽 벽에 붙이는 것과 같다
        add('서랍바닥', sx + Tsd - 키움/2, sy + Tsw - 키움/2, bz0,
            ww + 키움, (서랍깊 - 2*Tsw) + 키움, Tsb, 안흩어짐,
            {L:ww + 키움, W:(서랍깊 - 2*Tsw) + 키움, T:Tsb, grain:'가로'});
      } else {
        const 물 = 규칙.뒷판물림;
        add('서랍바닥', sx + 물, sy + 물, z0 - Tsb, 서랍폭 - 2*물, 서랍깊 - 2*물, Tsb, 안흩어짐,
            {L:서랍폭 - 2*물, W:서랍깊 - 2*물, T:Tsb, grain:'가로'});
      }
      // 10-06 — 이 칸에서 선 서랍재에 **그 마이다와 같은 번호**를 붙인다(§4.9850).
      // 번호가 같아야 「동작」 에서 마이다와 서랍이 **붙어서 같이** 나온다.
      for (let i = 처음조각; i < parts.length; i++) parts[i].서랍번호 = 칸번째;
    });
  }
  // 만든 부속 가운데 사장님이 자리를 일러 주신 것 — 「밴드」 (09-16 고쳐 주신 규칙).
  // 측판과 측판 사이에 정사이즈로 들어가고, **하판 위로 올라탄다**.
  // 재단은 두 방식 모두 같다 — 가로 = 내부 폭, 세로 = 전면밴드 + 하판 두께(기본값 764 × 98).
  //   덮기   — 가구 안쪽에서 뒷판과 맞닿는다(측판 안쪽 끝선과 맞춤)
  //   끼우기 — 뒷판 바깥(뒤)에 올라탄다. 두꺼우면 측판 뒤끝을 넘어 튀어나온다.
  const 넘침들 = {};                          // 자리있는부속 이름 → 측판 뒤끝을 넘어 나온 길이
  let 밴드넘침 = 0;
  // 보호대 — 사장님 말씀(09-17): 「측판의 바닥에서 하판까지 위치에 채워지는 부속.
  // 사이즈는 측판 바닥에서 하판 **바닥**까지로 조절된다.」 그래서 키가 `bz` 다(하판 두께를 안 먹는다).
  // 밴드 「하」 는 `bz + Tbot` 이라 하판 두께까지 먹는다 — 그 한 가지가 다르다.
  // 앞뒤(y) 자리는 사장님이 「밴드와 비슷한 개념」 이라고만 하셨다 — 우선 밴드와 같은 규칙으로 둔다.
  만든부속.forEach(c => {
    if (c.이름 !== '보호대') return;
    const 폭 = 안폭, 키 = bz;                  // 측판 바닥(0) ~ 하판 바닥(bz)
    if (!(키 > 0)) return;                     // 전면밴드 0 이면 설 자리가 없다
    /* 09-30 사장님 말씀: 「보호대의 경우 기존 두께가 안쪽으로 늘어나면 되는데 굳이 15mm로 변경할 필요가 있을까?」
       전에는 끼우기에서 `홈뒤`(391)부터 뒤로 뻗어 측판 뒤끝(400)을 9mm 넘었고, 그래서 두께가 15 로 깎였다.
       **이제 덮기·끼우기 둘 다 뒤끝에 맞춘다** — 두께는 사장님이 고르시는 그대로 두고 **자리를 앞으로 물린다.**
       그래서 넘침이 언제나 0 이고 경고가 아예 안 뜬다. **밴드는 이 규칙과 무관하다(§4.8 그대로).** */
    /* 10-02 사장님 말씀: 「보호대 위치를 현재의 측판끝에서 0.5mm단위로 **안쪽으로 이동**시킬 수 있는 옵션 부를 만들어 주세요」.
       `보호대유격` 만큼 **앞으로(안으로)** 물린다. 기본 0 이라 예전 자리 그대로다 — 뒤끝에 딱 맞는다.
       두께·폭·키는 한 톨도 안 바뀐다. 넘침은 그대로 0 이고 더 물리면 더 들어가므로 경고는 영영 안 뜬다. */
    // 앞을 넘지 못하게 붙잡는다 — 음수 자리에 부속이 서면 도면이 깨진다(관리자 10-02).
    // 붙잡는 것은 셈에서만이고 **담긴 숫자는 사장님이 넣으신 그대로** 둔다.
    const y = Math.max(0, CD - c.T - 규칙.보호대유격);
    넘침들['보호대'] = Math.max(0, (y + c.T) - CD);   // 늘 0 이다 — 뒤끝에 맞추고 안으로만 물리므로
    add('보호대', 안왼, y, 0, 폭, c.T, 키, [0,-1,0], {L:폭, W:키, T:c.T, grain:'가로'});
  });
  // 밴드가 오르내릴 수 있는 칸과, 「걸리는」 자리 (밴드 아랫끝 기준).
  // 사장님 말씀(09-17): 덮기에서 뒷판 라인을 따라 위아래로 자유롭게, 단 하판·상판을 벗어나지 않게.
  /* 10-02 사장님 말씀: 「**밴드의 높이 사이즈를 0.5단위로 변경**할 수 있는 옵션부를 추가해 주세요.
     현재 설정된 사이즈가 기본 세팅값입니다」.
     ⚠ 전에는 `밴드키` 한 변수가 **두 가지 다른 일**을 했다 — 「자리」(하판 윗면)와 「높이」.
     안 가르고 높이만 고치면 **밴드가 하판에서 떠오른다.** 그래서 둘로 갈랐다(관리자가 짚었다).
       `밴드바닥` = 자리 (하판 윗면 `bz + Tbot`) — 높이를 고쳐도 **안 따라간다**
       `밴드높`   = 높이 — 새 값은 **여기만** 들어간다. 담긴 것이 없으면 예전 그대로 `bz + Tbot` 이다
     `밴드천장`(상판 밑에 붙는 자리)과 「선반 밑에 달기」 는 밴드 **아랫끝**이라 높이를 따라간다. */
  const 밴드바닥 = bz + Tbot;
  const 밴드칸 = 만든부속.find(c => c.이름 === '밴드');
  const 담긴높이 = 밴드칸 ? Number(밴드칸.높이) : NaN;
  const 밴드높 = (Number.isFinite(담긴높이) && 담긴높이 > 0) ? 담긴높이 : bz + Tbot;
  // 높이가 몸통보다 크면 천장이 바닥 밑으로 내려간다 — 그 자리에 세우면 도면이 깨지므로 바닥에서 멈춘다
  const 밴드천장 = Math.max(밴드바닥, 상판밑 - 밴드높);
  const 걸림 = [밴드바닥, 밴드천장];                          // 하판 윗면 · 상판 밑면
  고정선반자리.forEach(([z0, z1]) => { 걸림.push(z1); 걸림.push(z0 - 밴드높); });  // 선반 위에 얹기 · 선반 밑에 달기
  const 걸림자리 = [...new Set(걸림.filter(z => z >= 밴드바닥 - 0.01 && z <= 밴드천장 + 0.01)
                                  .map(z => +z.toFixed(3)))].sort((a,b) => a-b);
  만든부속.forEach(c => {
    if (c.이름 !== '밴드') return;
    const 밴드폭 = 안폭;
    const 밴드y = 끼움 ? 홈뒤 : CD - c.T;
    const 넘침 = Math.max(0, (밴드y + c.T) - CD);        // 측판 뒤끝(CD)을 넘어 나온 길이
    const 놓기 = (z, 단이름) => { 밴드넘침 = 넘침; 넘침들['밴드'] = 넘침;
      add('밴드', 안왼, 밴드y, z, 밴드폭, c.T, 밴드높, [0,-1,0], {L:밴드폭, W:밴드높, T:c.T, grain:'가로'});
      const q = parts[parts.length-1];
      q.단 = 단이름;
      // 「하」·「상」 은 끌어 옮길 수 있어 자리(z)가 바뀐다. 자리로 열쇠를 삼으면 옮기는 순간
      // 숨김·지움이 풀린다 — 그래서 단(段)으로 붙잡는 열쇠를 따로 붙인다.
      // 「중」 은 선반마다 여럿이라 단으로는 서로 못 가린다. 그건 예전처럼 자리로 둔다(덮기에선 안 서고 안 움직인다).
      if (단이름 !== '중') q.단열쇠 = `밴드@단:${단이름}`; };
    // 끌어 옮긴 자리는 `c.옮김[단]` 에 담긴다 — 덮기에서만이다. 끼우기는 말씀에 없어 그대로 둔다.
    const 옮긴z = (단이름, 기본z) => {
      const v = (!끼움 && c.옮김) ? c.옮김[단이름] : undefined;
      return (typeof v === 'number' && isFinite(v)) ? Math.min(밴드천장, Math.max(밴드바닥, v)) : 기본z;
    };
    const 단 = 밴드단(c);
    if (단.includes('하')) 놓기(옮긴z('하', 밴드바닥), '하');   // 여태 있던 그 자리 — 하판 위로 올라탄다
    // 「중」 은 뒷판 끼우기일 때만이다 (09-17 사장님 말씀). 덮기에서는 밴드가 가구 안쪽(CD−두께)에
    // 앉아 선반 깊이와 그대로 겹쳤다. 끼우기는 뒷판 바깥(홈뒤)이라 선반이 거기까지 안 나온다.
    if (단.includes('중') && 끼움) 고정센터.forEach(z => 놓기(z - 밴드높/2, '중'));   // 고정선반 센터 높이
    if (단.includes('상')) 놓기(옮긴z('상', 밴드천장), '상');   // 상판 바로 아래에 붙는다
  });
  // ── 굳은 열쇠 — 부속이 움직여도 손질(숨김·지움·복제)이 안 풀리게 (09-22) ──────────────
  //   `자리(p) = 이름@x,y,z` 하나만 쓰면 **두께나 높이를 조금만 바꿔도 열쇠가 안 맞아
  //   지운 것이 슬그머니 되살아난다**(관리자가 잰 것: 상판 지움 → 두께 18→25 → 도로 섬).
  //   그래서 이름 안에서 **몇 번째 조각인가**로 붙잡는다 — `add()` 차례가 곧 번호다:
  //     측판 왼→오(짝:0·1) · 선반 아래→위 · 문짝 왼→오 · 한 장짜리(상판·하판·전면밴드·뒷판)는 짝:0.
  //   **밴드는 건드리지 않는다** — 제 단 열쇠(`밴드@단:하`)가 있고, 「중」 은 여러 장이라
  //   켜고 끄는 단에 따라 번호가 밀려서 도리어 어긋난다(§4.88).
  const 짝수 = {};
  parts.forEach(p => {
    const i = (짝수[p.name] = (짝수[p.name] === undefined ? 0 : 짝수[p.name] + 1));
    if (!p.단열쇠 && p.name !== '밴드') p.단열쇠 = `${p.name}@짝:${i}`;
  });
  // 손질한 것을 여기서 반영한다. 지운 것은 아예 빠지고, 숨긴 것은 3D·도면에 안 나오며(부품표에는 남는다),
  // 복제한 것은 부품표 수량만 는다(자리가 겹치므로 새로 안 선다).
  const 산것 = parts.filter(p => !열쇠들(p).some(k => 손질.지움.includes(k)));
  // 지운 밴드는 튀어나올 것도 없다 — 넘침을 셈한 뒤에 지움을 거르므로 여기서 다시 0 으로 돌린다.
  // (숨긴 밴드는 산것에 남는다. 숨겼어도 실제로 만드는 부속이라 경고는 그대로 떠야 한다.)
  if (밴드넘침 && !산것.some(p => p.name === '밴드')) 밴드넘침 = 0;
  Object.keys(넘침들).forEach(n => { if (!산것.some(p => p.name === n)) 넘침들[n] = 0; });
  산것.forEach((p, i) => { const ks = 열쇠들(p);
    p.pid = i; p.자리 = ks[0];                                   // 새로 적을 때는 앞엣것을 쓴다
    p.숨김 = ks.some(k => 손질.숨김.includes(k));
    p.더 = ks.reduce((a, k) => a + (손질.복제[k] || 0), 0); });
  // ── 실제 외경 — 부속을 전부 감싸는 네모 (09-30 사장님 말씀: 「실제외경을 따로 표기해 주세요」) ──
  //   짐작으로 더하지 않는다. 그래야 규칙이 늘어도 저절로 맞는다 —
  //   덮기 뒷판(뒤로) · 아웃도어 경첩유격+도어 두께(앞으로) · 측판 내밈(앞으로) 이 다 저절로 들어간다.
  //   **숨긴 것·지운 것은 뺀다** — 실제로 서는 부속만 감싼다.
  const 보임 = 산것.filter(p => !p.숨김);
  const 자 = (앞, 뒤) => 보임.length ? +(Math.max(...보임.map(뒤)) - Math.min(...보임.map(앞))).toFixed(3) : 0;
  const 외경 = { W: 자(p => p.x, p => p.x + p.w), D: 자(p => p.y, p => p.y + p.d), H: 자(p => p.z, p => p.z + p.h) };
  외경.같나 = Math.abs(외경.W - W) < 0.001 && Math.abs(외경.D - D) < 0.001 && Math.abs(외경.H - H) < 0.001;
  return { parts: 산것, pitch, CD, bz, 커버, 밴드키, sideH, 측아랫끝, innerH, innerW: 안폭, 안왼, 안오, 상판밑, 측밈, 측깊들, 측깊, 이동단, 문수,
           앞으로, 홈, 밴드넘침, 넘침들, 밴드바닥, 밴드천장, 밴드높, 걸림자리, 외경,
           선반깊이,     // 10-06 — 「측판의 실제 사용깊이」. 레일 고르개가 이 값을 본다(§4.9851)
           /* 10-06 사장님 말씀 — 「**서랍설정 옵션의 레일길이와 연동되어 서랍의 시작점 부터 설정된
              레일길이 만큼만 동작하는것이 핵심**」. 그래서 「동작」 이 **이 한 값**만 보고 연다(§4.9850).
              고르개와 **같은 자**(`레일맞춤`)를 쓴다 — 깊이가 줄어 못 쓰게 된 레일은 들어가는 가장 긴 것이 된다. */
           레일길이: 서랍칸.length ? 레일맞춤(선반깊이, 규칙.레일길이) : 0,
           서랍칸수: 서랍칸.length };
}

/* ───────── 2D 도면: 프리미티브 생성 (SVG·DXF 공용) ───────── */
const TH = 30; // 치수 문자 높이
// 치수배 — 화면에서만 1 보다 크게 준다. 글자를 키우면 치수가 서로의 선을 침범하므로
// 치수선을 물체에서 그만큼 더 띄워 단을 벌린다. 내보내는 파일은 언제나 1 이라 한 점도 안 달라진다.
function buildDrawing(s, m, 치수배 = 1){
  const {W,D,H,Ttop,Tside,Tshelf,Tdoor,Tbot,TB} = s;
  const P = [], hits = [];                      // hits = 화면에서 짚을 자리. P 와 따로라 내보내기에는 안 실린다.
  let pid = null;                               // 지금 그리는 것이 어느 부속인가 (부속이 아니면 null)
  // 쪽 = 이것이 어디로 나가는가. 0 화면·SVG·DXF 다 / 1 화면·SVG 만(꾸밈) / 2 DXF 만.
  // CAD 가 읽는 DXF 에는 꾸밈을 안 실는다 — 도면 자료에 장식이 섞이면 안 된다.
  let 쪽 = 0;
  const line = (x1,y1,x2,y2,layer='OUTLINE',굵기) => P.push({t:'line',x1,y1,x2,y2,layer,pid,쪽,굵기});

    ['구성',        `${선반명} ${s.shelves}단 · 이동선반 ${m.이동단}단`],
    ['',            `${도어명} ${m.문수}${도어명 === '마이다' ? '개' : '짝'} · ${모드글(s.doorMode, s.품목)}`],
    ['투상법·단위', '제3각법 · mm'],
    ['날짜',        new Date().toISOString().slice(0,10)]
  ];
  const tH = 표제.length * rh2;
  표제.forEach(([이름, 값, 크기], i) => {
    const y = ty - i*rh2;
    if (이름) text(이름, bx + 20, y - rh2/2, 22, 'TITLE', 'ML');
    text(값, bx + lw + 20, y - rh2/2, 크기 || 24, 'TITLE', 'ML');
    if (i) line(bx, y, bx + tw, y, 'TITLE');
  });
  line(bx, ty, bx + tw, ty, 'TITLE', '강');
  line(bx, ty - tH, bx + tw, ty - tH, 'TITLE', '강');
  line(bx, ty, bx, ty - tH, 'TITLE', '강'); line(bx + tw, ty, bx + tw, ty - tH, 'TITLE', '강');
  line(bx + lw, ty, bx + lw, ty - tH, 'TITLE');
  쪽 = 0;

  // 칸을 두 벌 잰다 — 화면·SVG 용(꾸밈 포함)과 DXF 용(꾸밈 빼고, 예전 그대로)
  const 재기 = 거를것 => {
    let minx=Infinity, miny=Infinity, maxx=-Infinity, maxy=-Infinity;
    P.forEach(p => {
      if (p.쪽 === 거를것) return;
      if (p.t === 'line'){ minx=Math.min(minx,p.x1,p.x2); maxx=Math.max(maxx,p.x1,p.x2); miny=Math.min(miny,p.y1,p.y2); maxy=Math.max(maxy,p.y1,p.y2); }
      else { const hw = p.str.length*p.h*0.6/2; minx=Math.min(minx,p.x-hw); maxx=Math.max(maxx,p.x+hw); miny=Math.min(miny,p.y-p.h); maxy=Math.max(maxy,p.y+p.h); }
    });
    return {minx,miny,maxx,maxy};
  };
  const bboxDxf = 재기(1);                       // DXF 는 꾸밈을 뺀 채로 잰다
  const b = 재기(2);
  // 도면 테두리 — 종이 한 장처럼 보이게 마지막에 두른다. 화면·SVG 에만 나간다.
  const 여백 = 200;
  b.minx -= 여백; b.miny -= 여백; b.maxx += 여백; b.maxy += 여백;
  쪽 = 1;
  // 층은 TITLE 이다 — OUTLINE 은 가구 외곽선 자리라 종이 테두리가 섞이면 안 된다. 굵기만 따로 준다.
  line(b.minx, b.miny, b.maxx, b.miny, 'TITLE', '강'); line(b.maxx, b.miny, b.maxx, b.maxy, 'TITLE', '강');
  line(b.maxx, b.maxy, b.minx, b.maxy, 'TITLE', '강'); line(b.minx, b.maxy, b.minx, b.miny, 'TITLE', '강');
  쪽 = 0;
  return { P, hits, bbox:b, bboxDxf, 세로칸:m.pitch };   // 세로칸 = 선반 사이 — 세로 치수 글자를 얼마나 키울지 정한다
}

// 홈을 파는 부속 — 사장님 말씀의 「양측판, 상판, 맨바닥선반」. 이 모델에서 뒷판이 닿는 맨 아래 것은 하판이라 하판으로 본다.
const 홈부속 = ['측판','상판','하판'];
// 자리 규칙이 있어 buildModel 이 직접 세우는 만든 부속 — 부품표에서 두 번 세지 않는다.
const 자리있는부속 = ['밴드','보호대'];
// 밴드가 설 단 — 사장님 말씀(09-17). 「상 · 중 · 하」 를 여러 개 켤 수 있고 다 끌 수도 있다.
//   하 = 여태 있던 그 자리(하판 위) · 중 = 고정선반 센터마다 하나 · 상 = 상판 바로 아래 하나
// 예전에 만들어 둔 밴드에는 이 값이 없다 — 그때는 「하」 하나뿐이었으므로 그렇게 읽는다.
const 밴드단 = c => Array.isArray(c.단) ? c.단 : ['하'];
const 밴드단값 = ['상','중','하'];
function bomRows(m){
  const map = new Map();
  const 홈글 = m.홈 ? `홈 ${fmt(m.홈.깊이)}×${fmt(m.홈.폭)}` : '';
  m.parts.forEach(p => {
    const k = `${p.name}|${p.cut.L}|${p.cut.W}|${p.cut.T}`;
    // 결은 사장님이 켠 것만 적는다 — 안 켰으면 빈칸이다(§4.96)
    if (!map.has(k)) map.set(k, {name:p.name, qty:0, 비고: (홈글 && 홈부속.includes(p.name)) ? 홈글 : '', ...p.cut, grain:결표기(본이름(p.name))});
    map.get(k).qty += 1 + (p.더 || 0);
  });
  // 만든 부속 — 재단은 선반과 같은 규칙(내부 폭 × 몸통 깊이)을 쓴다. 자리 규칙은 아직 없다.
  만든부속.forEach(c => { if (자리있는부속.includes(c.이름)) return; map.set(`${c.이름}|만든`, {name:c.이름, qty:1, L:m.innerW, W:m.CD, T:c.T, grain:결표기(c.이름), 비고:''}); });
  return [...map.values()];
}

/* ───────── SVG 렌더 ───────── */
// 글자배 — 폰에서는 도면이 작게 눌려 치수 숫자가 2px 로 떨어진다. 그래서 화면에 그릴 때만
// 치수 숫자와 투상 제목을 키운다. 표(부품표·표제란) 글자는 칸을 넘치므로 그대로 둔다.
// 내려받는 SVG 와 DXF 는 손대지 않는다 — 종이로 뽑으면 원래 크기가 맞다.
function renderSVG(d, 화면, 글자배 = 1){
  const {minx,miny,maxx,maxy} = d.bbox, pad = 140;
  const 세로배 = Math.min(글자배, Math.max(1, (d.세로칸 || 400) * 0.55 / 117));
  const 보임 = d.P.filter(p => p.쪽 !== 2);       // DXF 로만 가는 것은 화면·SVG 에 안 그린다
  // 세로로 세운 치수 글자는 선반 사이에 줄지어 서므로, 그 칸을 넘지 않을 만큼만 키운다.
  // 투상 제목은 글자가 길어 많이 키우면 옆 제목과 부딪힌다 — 1.3 배까지만.
  const 키움값 = p => !(화면 && 글자배 > 1) ? 1
    : (p.layer === 'DIM' ? (p.rot ? 세로배 : 글자배) : (p.h >= 46 ? Math.min(글자배, 1.3) : 1));
  // ── 치수 숫자 자리 다시 잡기 (§4.55) ──────────────────────────────────
  // 글자를 키우면 제자리(치수선에서 23)에 못 앉는다. 후보 자리를 차례로 재서
  // 부속 네모·치수선·다른 숫자에 **아무 데도 안 닿는** 자리를 고른다.
  // 키움이 1(내보내는 파일)이면 아래 길로 아예 안 들어오므로 DXF·저장 SVG 는 한 점도 안 달라진다.
  const 재배치 = !!(화면 && 글자배 > 1);
  // 글상자 — 재서 정한 값이다(숫자 한 자 폭 0.601배, 글자 높이 0.72배). 여유를 얹어 넉넉히 잡는다.
  const 글상자 = (cx,cy,fs,str,rot) => {
    const w = str.length*fs*0.62, h = fs*0.80;
    const sw = rot ? h : w, sh = rot ? w : h;
    return {x:cx-sw/2, y:cy-sh/2, w:sw, h:sh};
  };
  const 닿나 = (a,b) => a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
  const 넓이 = (a,b) => Math.max(0, Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))
                      * Math.max(0, Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  const 막이 = [], 글자막이 = [];                 // 막이 = 부속 네모와 모든 선. 글자는 자리가 바뀌므로 따로.
  if (재배치){
    d.hits.forEach(h => 막이.push({x:h.x, y:h.y, w:h.w, h:h.h}));
    보임.forEach(q => { if (q.t === 'line'){ const 여 = 5;
      막이.push({x:Math.min(q.x1,q.x2)-여, y:Math.min(q.y1,q.y2)-여,
                 w:Math.abs(q.x2-q.x1)+2*여, h:Math.abs(q.y2-q.y1)+2*여}); } });
    보임.forEach(q => { if (q.t === 'text')
      글자막이.push(글상자(q.x, q.y, q.h*1.3*키움값(q), q.str, q.rot)); });
  }
  const 잰다 = (상자, 나) => {                     // 겹친 넓이 합. 0 이면 깨끗한 자리다
    let s = 0;
    for (const m of 막이) if (닿나(상자,m)) s += 넓이(상자,m);
    for (let k = 0; k < 글자막이.length; k++){ if (k === 나) continue;
      if (닿나(상자,글자막이[k])) s += 넓이(상자,글자막이[k]); }
    return s;
  };
  let 글차례 = -1;
  const out = [];
  보임.forEach(p => {
    if (p.t === 'line'){ out.push(`<line class="${p.layer}${p.굵기 ? ' ' + p.굵기 : ''}"${화면 && p.pid !== null && p.pid !== undefined ? ` data-pid="${p.pid}"` : ''} x1="${p.x1}" y1="${-p.y1}" x2="${p.x2}" y2="${-p.y2}" vector-effect="non-scaling-stroke"/>`); return; }
    글차례++;
    const anchor = p.align === 'ML' ? 'start' : 'middle';
    const 키움 = 키움값(p), fs = p.h*1.3*키움;
    let tx = p.x, ty = p.y, 지시 = null;
    if (재배치 && p.밀기){
      const [sgx, sgy, 사이, 폭] = p.밀기;
      const 반 = fs*0.40, 반폭 = p.str.length*fs*0.62/2, 여유 = 14, 기본 = p.h/2 + 8;
      // 치수선 위의 점. n = 치수선에서 물체 쪽, t = 치수선을 따라가는 쪽.
      const lx = p.x + sgx*기본, ly = p.y + sgy*기본;
      const nx = -sgx, ny = -sgy, ux = sgy ? 1 : 0, uy = sgy ? 0 : 1;
      const 자리 = (c,s) => [lx + nx*c + ux*s, ly + ny*c + uy*s];
      const 끝밖 = 폭/2 + 반폭 + 여유 + 12;
      const 후보 = [
        [기본, 0],                     // ① 예전 자리 — 안 겹치면 옮기지 않는다
        [반 + 여유, 0],                // ② 제 치수선 바로 안쪽 (캐드에서 숫자가 앉는 자리)
        [-(반 + 여유), 0],             // ③ 제 치수선 바깥
        [사이 - 반 - 여유, 0],         // ④ 물체에 바짝
        [0,  끝밖],                    // ⑤ 치수선 끝 바깥 — 한쪽
        [0, -끝밖],                    // ⑥ 치수선 끝 바깥 — 다른쪽
        [-(반 + 여유 + 130), 0]        // ⑦ 한 단 더 바깥
      ];
      let 고른 = null;
      for (const [c,s] of 후보){
        const [cx,cy] = 자리(c,s);
        if (잰다(글상자(cx, cy, fs, p.str, p.rot), 글차례) === 0){ 고른 = [cx,cy]; break; }
      }
      if (!고른){                       // 다 막혔다 — 지시선을 그어 바깥으로 뺀다 (홈 치수가 쓰는 방식)
        const [cx,cy] = 자리(-(반 + 여유 + 300), 끝밖);
        고른 = [cx,cy];
        지시 = [lx, ly, cx + nx*(반 + 10), cy + ny*(반 + 10)];
      }
      tx = 고른[0]; ty = 고른[1];
      글자막이[글차례] = 글상자(tx, ty, fs, p.str, p.rot);   // 뒤에 오는 숫자가 이 자리를 피하게
    }
    const tr = p.rot ? ` transform="rotate(${-p.rot} ${tx} ${-ty})"` : '';
    if (지시) out.push(`<line class="DIM 지시" x1="${지시[0]}" y1="${-지시[1]}" x2="${지시[2]}" y2="${-지시[3]}" vector-effect="non-scaling-stroke"/>`);
    out.push(`<text class="${p.layer}" x="${tx}" y="${-ty}" font-size="${fs}" text-anchor="${anchor}" dominant-baseline="central"${tr}>${esc(p.str)}</text>`);
  });
  if (화면)                                     // 작은 부속이 위로 오게 — 큰 것에 묻히지 않는다
    [...d.hits].sort((a,b) => b.w*b.h - a.w*a.h).forEach(h =>
      out.push(`<rect class="pick" data-pid="${h.pid}" x="${h.x}" y="${-(h.y+h.h)}" width="${h.w}" height="${h.h}" vector-effect="non-scaling-stroke"/>`));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minx-pad} ${-(maxy+pad)} ${maxx-minx+2*pad} ${maxy-miny+2*pad}" preserveAspectRatio="xMidYMid meet" fill="none" stroke-linecap="round">${out.join('')}</svg>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 저장용 SVG: 테마 변수 대신 고정 색 (검정 선, 빨강 치수)
function svgForFile(d){
  const css = `<style>line{stroke:#000;stroke-width:0.4}.HIDDEN{stroke:#666;stroke-dasharray:7 4;stroke-width:0.2}.DIM{stroke:#c0392b;stroke-width:0.16}.HATCH{stroke:#777;stroke-width:0.12}.TITLE{stroke:#888;stroke-width:0.18}text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace;fill:#333}.강{stroke-width:0.3}text.DIM{fill:#c0392b}text.TEXT{fill:#1F5FA8}</style>`;
  return renderSVG(d).replace('<svg ', '<svg width="' + (d.bbox.maxx-d.bbox.minx+280) + 'mm" ').replace('>', '>' + css);
}

/* ───────── 부속 도면 — A4 한 장씩 ─────────
   도면 칸은 A4 여러 쪽이 위아래로 이어진 곳이다. 1쪽은 여태 쓰던 전체도면 그대로,
   2쪽부터는 부속 하나하나의 도면과 치수다. 한 쪽에 세 부속씩 넣고, 부속이 늘면 쪽이 는다.
   여기서 그리는 것은 buildDrawing 의 P 와 아무 상관이 없다 —
   내보내는 SVG·DXF 는 이 쪽들을 모른다(덮기 DXF 71,698 바이트 그대로다). */
const A4 = { W:210, H:297, 여백:10, 칸수:3, 정보:66 };
// 10-05 사장님 말씀 — 서랍재는 「부속의 **마이다 바로 아래부분**에 서랍재W 서랍재D 서랍바닥 의 부속으로」 나온다.
const 부속차례 = ['측판','상판','하판','문짝','마이다','서랍재W','서랍재D','서랍바닥','고정선반','가로대','이동선반','전면밴드','뒷판','밴드'];
const 홈면 = { 측판:'안쪽면', 상판:'아랫면', 하판:'윗면' };   // 어느 면에 홈을 파는가 (1쪽 홈 가공도와 같다)
// 글자 폭 어림 — 한글은 한 칸, 로마자·숫자는 0.62 칸으로 본다. 머리글이 넘칠지 재는 데만 쓴다.
const 글자폭 = (str, em) => [...str].reduce((a, c) => a + (c.charCodeAt(0) > 127 ? em : em*0.62), 0);
const 줄여서 = (str, em, 넓이) => { let t = str;
  while (t.length > 1 && 글자폭(t + '…', em, 넓이) > 넓이) t = t.slice(0, -1);
  return t === str ? str : t + '…'; };
const n2 = n => String(Math.round(n*100)/100);

// 부속 도면에 실을 줄. 부품표와 같은 규칙으로 묶는다.
// 숨긴 부속도 그대로 실는다 — 숨기기는 3D 에서만이다(사장님 말씀 09-17).
function 부속행들(m){
  const map = new Map();
  m.parts.forEach(p => {
    const k = `${p.name}|${p.cut.L}|${p.cut.W}|${p.cut.T}`;
    if (!map.has(k)) map.set(k, {name:p.name, qty:0, 홈:!!(m.홈 && 홈부속.includes(p.name)), ...p.cut, grain:결표기(본이름(p.name))});
    map.get(k).qty += 1 + (p.더 || 0);
  });
  만든부속.forEach(c => { if (자리있는부속.includes(c.이름)) return; map.set(`${c.이름}|만든`, {name:c.이름, qty:1, L:m.innerW, W:m.CD, T:c.T, grain:결표기(c.이름), 홈:false}); });
  // 자주 보는 것이 앞에 온다 — 몸통 → 문짝 → 선반 → 전면밴드 → 뒷판, 만든 부속은 맨 뒤.
  // 부품표(bomRows)의 차례는 건드리지 않는다.
  const 순 = n => { const i = 부속차례.indexOf(n); return i < 0 ? 부속차례.length : i; };
  return [...map.values()].sort((a, b) => 순(a.name) - 순(b.name));
}

/* 부속 정보 줄 — 2D 부속 쪽의 정보 칸이 적는 그 줄들이다.
   10-06 사장님 말씀(「3d도면 상태에서 부속 선택시 해당 부속의 2D도면에서 표현된 정보가 3D 도면 우측 여백에」)으로
   3D 우측칸도 **이 한 자리**를 쓴다. ⚠ 베껴 쓰면 둘이 어긋난다 — 줄을 더하거나 뺄 때 여기만 고친다. */
function 부속정보줄(r, m){
  const 줄 = [['수량', r.qty], ['가로', fmt(r.L)], ['세로', fmt(r.W)], ['두께', fmt(r.T)]];
  if (r.grain) 줄.push(['결', r.grain]);

  g(9,'$EXTMAX'); g(10,fx(bb.maxx)); g(20,fx(bb.maxy)); g(30,0);

  g(0,'ENDTAB');

  g(0,'ENDTAB');

  g(0,'ENDTAB');

    if (p.쪽 === 1) return;                       // 꾸밈은 CAD 자료에 안 실는다

    }

  return L.join('\r\n') + '\r\n';
}

      서랍번호:p.서랍번호,     // 부속 번호와 부품표 열쇠 · 10-06 「동작」 이 보는 서랍 번호(없으면 undefined)
      /* 10-06 「동작」 의 도어 돌 축 — [축 x, 축 z, 어느 쪽으로, 문 폭](없으면 undefined · §4.9850-도어).
         축은 **경첩 쪽 세로 모서리의 바깥면**이다(문짝 앞면 = 모델 y → three z 는 `D/2 − y`).
         ⚠ 뒷면을 축으로 두면 **문이 측판을 파고든다** — 아웃도어 2mm · 인도어 18mm(재서 잡았다).
            바깥면을 축으로 두면 110도에서도 **몸통과 한 톨도 안 겹친다.**
         ⚠ three 의 `rotation.y = θ` 는 `x' = x·cosθ + z·sinθ · z' = −x·sinθ + z·cosθ` 다.
            왼경첩은 문이 축의 **+x 쪽**에 있으므로 앞(+z)으로 나오려면 **θ < 0**, 오른경첩은 **θ > 0** 이다. */
      경첩: p.경첩 ? [(p.경첩 === 'L' ? p.x : p.x + p.w) - W/2, D/2 - p.y,
                      p.경첩 === 'L' ? -1 : 1, p.w] : undefined };
    group.add(mesh);
  });
  /* 10-06 사장님 말씀 — 「동작시 **서랍측면에** 측판 끝으로 부터 몇mm 나오는지 표기해줘 **제일 하단서랍 1칸에**」.
     ⚠ 거리를 새로 셈하지 않는다 — **「측판 앞끝」 과 「맨 아래 서랍재D 앞면」 두 자리를 모델에서 그대로 받아**
        그 차와 `나옴`(= 레일 × 칸열림)으로 낸다. 베끼면 우라홈·도어 방식을 고칠 때 두 자리가 어긋난다(§4.9851 의 그 길).
     ⚠ 「제일 하단」 은 `서랍번호 === 0` 이다(`서랍칸` 이 아래에서 위로 돌므로 · §4.9850).
     딱지는 **왼쪽 서랍재D** 옆에 붙는다 — 분해에서 덩어리가 가는 그 쪽이라 가려질 일이 적다. */
  나옴기준 = null;
  const 밑서랍 = m.parts.filter(p => p.name === '서랍재D' && p.서랍번호 === 0 && !p.숨김);
  const 측판하나 = m.parts.find(p => p.name === '측판');
  if (밑서랍.length && 측판하나){
    const d = 밑서랍.reduce((a, b) => a.x <= b.x ? a : b);          // 왼쪽 것
    나옴기준 = { x:d.x + d.w/2 - W/2, y:d.z + d.h/2 - H/2, 앞:d.y, 측앞:측판하나.y, D };
  }
  applyExplode();
  makeGrid(); makeAxes();
  그리자();                            // 치수를 바꿔 조각이 새로 섰다
  // 세팅을 바꿀 때마다 보시던 시각이 처음으로 돌아가지 않게, 맞추기는 첫 판에서만 한다.
  // 다시 맞추고 싶으시면 도구줄의 「전체」 나 Shift+Z 를 쓰시면 된다.
  if (첫판){ zoomExtents(); 첫판 = false; }
}
/* 10-06 사장님 말씀 — 「**분해조절에 분해/동작 두가지**를 두어 동작선택후 볼륨 조절시 제품이 동작하는 화면이
   나오도록 … 서랍장에서의 동작은 서랍(마이다+서랍)이 **제일 아래칸 부터 하나씩** 나중에는 모든 서랍이
   열려있는 모습으로 … **레일길이와 연동되어 서랍의 시작점 부터 설정된 레일길이 만큼만** 동작하는것이 핵심」(§4.9850).
   ⚠ **열린 길이 = 그 모델의 레일길이.** 그 이상 못 나온다 — 이 한 가지가 말씀의 핵심이다.
   ⚠ **앞은 three 의 +Z 다** — `base[2] = D/2 − (p.y + p.d/2)` 라 모델 y 가 작을수록(앞일수록) z 가 크다.
      분해에서 덩어리가 가는 **왼쪽(−X)이 아니다**(재서 확인했다). */
const 칸열림 = (v, n, i) => Math.max(0, Math.min(1, v*n - i));   // 아래(i=0)부터 차례로 · v=1 이면 다 1
/* 10-06 사장님 말씀 — 「**동작시 서랍측면에 측판 끝으로 부터 몇mm 나오는지 표기**해줘 제일 하단서랍 1칸에」.
   그린 **뒤에** 부른다 — 카메라가 움직이면 딱지도 따라가야 한다(그림 고리 안 · §4.11 의 그 ⚠).
   ⚠ 3D 조각으로 글자를 만들지 않았다 — 돌려도 안 눕고 글꼴이 또렷해야 읽힌다. **떠 있는 딱지**다.
   ⚠ 자리는 `.view3d` 기준이다 — 폰에서는 캔버스가 띠 밑으로 내려가 둘이 다르다(§4.9861). */
function 나옴표맞추기(){
  const el = $('#outTag'); if (!el) return;
  const t = 나옴기준, m = 모델;
  if (!t || !m || state.분해모드 !== '동작' || !m.레일길이 || !m.서랍칸수 || !camera){ el.hidden = true; return; }
  const 나옴 = m.레일길이 * 칸열림(state.explode, m.서랍칸수, 0);
  const mm = 나옴 - (t.앞 - t.측앞);                 // 측판 앞끝 ~ 서랍재D 앞면 (나온 뒤)
  if (!(mm > 0.05)){ el.hidden = true; return; }      // 아직 안 나왔으면 적을 것이 없다(§0)
  const 가운데 = (t.측앞 + (t.앞 - 나옴)) / 2;        // 그 틈의 한가운데 — 치수를 적는 자리
  const v = new THREE.Vector3(t.x, t.y, t.D/2 - 가운데).project(camera);
  if (v.z > 1 || Math.abs(v.x) > 1 || Math.abs(v.y) > 1){ el.hidden = true; return; }   // 화면 밖이면 접는다
  const cv = $('#c3d'), 칸 = cv && cv.parentElement;
  if (!cv || !칸) { el.hidden = true; return; }
  const a = cv.getBoundingClientRect(), b = 칸.getBoundingClientRect();
  el.textContent = fmt(Math.round(mm * 10) / 10) + 'mm';
  el.style.left = ((a.left - b.left) + (v.x + 1) / 2 * a.width) + 'px';
  el.style.top  = ((a.top  - b.top ) + (1 - v.y) / 2 * a.height) + 'px';
  el.hidden = false;
}
/* 10-06 사장님 말씀 — 「수납장 품목의 동작의 경우 양쪽 도어가 열리는 모습을 … **기본 110** 열리는 모습」.
   사장님이 숫자를 글자로 주셨다. 칸을 따로 만들지 않았다 — 고르개로 내려면 한 줄이다(§4.9850-도어). */
const 도어열림각 = 110;
function applyExplode(){
  if (state.분해모드 === '동작'){
    // 서랍이 없는 품목(수납장)·레일이 하나도 안 들어가는 얕은 장에서는 **서랍이 안 움직인다** — 닫힌 모습 그대로다.
    const 레일 = (모델 && Number.isFinite(모델.레일길이)) ? 모델.레일길이 : 0;
    const n = (모델 && 모델.서랍칸수) || 0;
    group.children.forEach(c => { const {base, 서랍번호, 경첩} = c.userData;
      if (경첩){                                     // 수납장 도어 — 경첩을 축으로 돈다
        const θ = 경첩[2] * state.explode * 도어열림각 * Math.PI / 180;
        const co = Math.cos(θ), si = Math.sin(θ);
        const dx = base[0] - 경첩[0], dz = base[2] - 경첩[1];
        c.rotation.y = θ;
        c.position.set(경첩[0] + dx*co + dz*si, base[1], 경첩[1] - dx*si + dz*co);
        return;
      }
      c.rotation.y = 0;
      const 나옴 = (n && 레일 && 서랍번호 !== undefined) ? 레일 * 칸열림(state.explode, n, 서랍번호) : 0;
      c.position.set(base[0], base[1], base[2] + 나옴); });   // 몸통은 `나옴` 이 0 이라 한 톨도 안 움직인다
    그리자(); return;
  }
  const e = state.explode * Math.max(state.H, state.W) * 0.28;
  // ⚠ 「동작」 에서 돌려 둔 도어를 **되돌려 놓는다** — 안 그러면 분해도에서 도어가 비스듬히 선 채로 남는다.
  group.children.forEach(c => { const {base,dir} = c.userData; c.rotation.y = 0;
    c.position.set(base[0]+dir[0]*e, base[1]+dir[1]*e, base[2]+dir[2]*e); });
  그리자();
}
function setPressed(v){ document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }

     ⚠ 이 두 줄을 지우지 마라. 기본표가 비면 모든 부속이 엣지 0 으로 떨어진다. */

  const 두께순 = Object.keys(area).sort((a,b) => area[b] - area[a]);   // 두께가 여럿이라 면적 큰 둘을 보인다
  [['#stAreaT','#stAreaTLabel',0], ['#stAreaB','#stAreaBLabel',1]].forEach(([v,l,i]) => {

  applySel();

  이름칸갱신();                                                    // 품목마다 이름표·사이즈 칸 (사장님 말씀 10-02)
  지우기단추갱신();                                                // 두께 줄의 × 상태 (사장님 말씀 09-17)
  결단추갱신();                                                    // 두께 줄의 결 방향 단추 (사장님 말씀 09-22)
