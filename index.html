<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캐비닛 설계실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#1B2430; --ink2:#5B6673; --ink3:#8A93A0;
  --line:#D5DBE2; --line2:#E6EAEE; --accent:#1F5FA8; --accent-ink:#FFFFFF; --accent-soft:#E3ECF7;
  --dim:#C8322B; --hidden:#8A93A0; --hatch:#A3ABB5; --grid:#C4CCD4; --grid2:#DCE2E8; --ok:#2E7D4F;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12181F; --surface:#1A222B; --surface2:#202A34; --ink:#E6EBF0; --ink2:#98A4B1; --ink3:#6E7A88;
  --line:#2C3743; --line2:#243039; --accent:#6FA8E8; --accent-ink:#0F1A28; --accent-soft:#1E3550;
  --dim:#E8685F; --hidden:#7C8794; --hatch:#5E6975; --grid:#31404E; --grid2:#27333F; --ok:#5FBF86;
}}
:root[data-theme="dark"]{
  --bg:#12181F; --surface:#1A222B; --surface2:#202A34; --ink:#E6EBF0; --ink2:#98A4B1; --ink3:#6E7A88;
  --line:#2C3743; --line2:#243039; --accent:#6FA8E8; --accent-ink:#0F1A28; --accent-soft:#1E3550;
  --dim:#E8685F; --hidden:#7C8794; --hatch:#5E6975; --grid:#31404E; --grid2:#27333F; --ok:#5FBF86;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.app{display:grid;min-height:100vh;grid-template-columns:284px minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(440px,1fr) auto;
  grid-template-areas:"head head head" "params view3d draw" "params bom draw";gap:1px;background:var(--line)}
.app>*{background:var(--surface);min-width:0}
header{grid-area:head;display:flex;align-items:center;gap:20px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--ink3)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
.params{grid-area:params;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{margin:0;font-size:11px;font-family:"IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:500;
  display:flex;align-items:center;gap:8px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line2)}
.field{display:grid;grid-template-columns:1fr 112px;align-items:center;gap:10px}
.field label{color:var(--ink);font-weight:500}
.field small{display:block;color:var(--ink3);font-weight:400;font-size:12px}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface2);overflow:hidden}
.num input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;padding:6px 8px;text-align:right;min-width:0;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num span{padding:0 8px 0 0;color:var(--ink3);font-size:12px}
select{font:inherit;font-family:"IBM Plex Mono",monospace;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2)}
.seg label{flex:1;text-align:center;padding:6px 4px;cursor:pointer;font-size:13px;color:var(--ink2);position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.seg label+label{border-left:1px solid var(--line)}
.field.wide{grid-template-columns:1fr}
input[type=range]{width:100%;accent-color:var(--accent)}
.stats{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding-top:14px;border-top:1px solid var(--line2)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink2);letter-spacing:.04em}
.view3d{grid-area:view3d;position:relative;background:var(--surface2);min-height:440px}
.view3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.view3d canvas:active{cursor:grabbing}
.hud{position:absolute;left:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.hud button{padding:5px 10px;font-size:12px;background:var(--surface);}
.hud button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.explode{position:absolute;right:14px;bottom:12px;left:14px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;max-width:360px;margin-left:auto}
.explode label{font-size:12px;color:var(--ink2);white-space:nowrap}
.viewtag{position:absolute;left:14px;bottom:14px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);letter-spacing:.08em}
.draw{grid-area:draw;display:flex;flex-direction:column;min-height:440px}
.panelhead{display:flex;align-items:baseline;gap:10px;padding:12px 18px 8px;border-bottom:1px solid var(--line2)}
.panelhead h2{margin:0;font-size:13px;font-weight:600}
.panelhead .eyebrow{margin-left:auto}
.svgwrap{flex:1;min-height:0;padding:10px;overflow:auto}
.svgwrap svg{width:100%;height:100%;display:block}
.svgwrap .OUTLINE{stroke:var(--ink);stroke-width:1.4px}
.svgwrap .HIDDEN{stroke:var(--hidden);stroke-width:1px;stroke-dasharray:8 5}
.svgwrap .DIM{stroke:var(--dim);stroke-width:.9px}
.svgwrap .HATCH{stroke:var(--hatch);stroke-width:.7px}
.svgwrap .TITLE{stroke:var(--ink2);stroke-width:1px}
.svgwrap text{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;fill:var(--ink2)}
.svgwrap text.DIM{fill:var(--dim)}
.svgwrap text.TEXT{fill:var(--accent)}
.svgwrap text.TITLE{fill:var(--ink)}
.bom{grid-area:bom;display:flex;flex-direction:column}
.bom table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.bom th,.bom td{padding:7px 18px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
.bom th{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.bom td:first-child,.bom th:first-child{text-align:left}
.bom td.mono{font-family:"IBM Plex Mono",monospace}
.bom .grain{color:var(--ink3);font-size:12px}
.bom tfoot td{color:var(--ink2);font-size:12px;border-bottom:0}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(720px,92vw)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dlg{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:15px}
.dlg p{margin:0;color:var(--ink2);font-size:13px}
.dlg textarea{width:100%;height:240px;font:12px/1.4 "IBM Plex Mono",monospace;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:1100px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(380px,60vh) minmax(380px,60vh) auto;grid-template-areas:"head" "params" "view3d" "draw" "bom"}
  .params{padding-bottom:18px}.stats{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Panel furniture · 3D + 2D drafting</span>
      <h1>캐비닛 설계실</h1>
    </div>
    <div class="toolbar">
      <button id="btnSvg" type="button">SVG 도면 저장</button>
      <button id="btnDxf" type="button" class="primary">DXF 내보내기</button>
    </div>
  </header>

  <aside class="params" aria-label="치수 설정">
    <div class="group">
      <h2>외형 치수</h2>
      <div class="field"><label for="W">폭 <small>Width</small></label><div class="num"><input id="W" data-key="W" type="number" min="300" max="2400" step="1" value="800"><span>mm</span></div></div>
      <div class="field"><label for="D">깊이 <small>Depth</small></label><div class="num"><input id="D" data-key="D" type="number" min="200" max="800" step="1" value="400"><span>mm</span></div></div>
      <div class="field"><label for="H">높이 <small>Height</small></label><div class="num"><input id="H" data-key="H" type="number" min="300" max="2400" step="1" value="1800"><span>mm</span></div></div>
    </div>
    <div class="group">
      <h2>판재</h2>
      <div class="field"><label for="T">몸통 판재</label><select id="T" data-key="T"><option>12</option><option>15</option><option selected>18</option><option>24</option></select></div>
      <div class="field"><label for="TB">뒷판</label><select id="TB" data-key="TB"><option>3</option><option>5</option><option selected>9</option><option>12</option></select></div>
      <div class="field wide"><label>상판 결합 <small>측판이 상판을 감싸는지, 상판이 측판을 덮는지</small></label>
        <div class="seg"><label><input type="radio" name="topStyle" value="inset" checked>측판 사이</label><label><input type="radio" name="topStyle" value="overlay">측판 위</label></div></div>
    </div>
    <div class="group">
      <h2>내부 · 전면</h2>
      <div class="field wide"><label for="shelves">선반 <b id="shelvesVal" class="mono">3</b>단</label><input id="shelves" data-key="shelves" type="range" min="0" max="8" step="1" value="3"></div>
      <div class="field"><label for="plinth">걸레받이 <small>0 = 없음</small></label><div class="num"><input id="plinth" data-key="plinth" type="number" min="0" max="200" step="1" value="80"><span>mm</span></div></div>
      <div class="field wide"><label>문짝</label>
        <div class="seg"><label><input type="radio" name="doors" value="0">없음</label><label><input type="radio" name="doors" value="1">여닫이 1</label><label><input type="radio" name="doors" value="2" checked>여닫이 2</label></div></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stPitch">–</b><span>선반 간격 (내부 유효)</span></div>
      <div class="stat"><b id="stInner">–</b><span>내부 폭 × 깊이</span></div>
      <div class="stat"><b id="stAreaT">–</b><span id="stAreaTLabel">18T 소요 면적</span></div>
      <div class="stat"><b id="stAreaB">–</b><span id="stAreaBLabel">9T 소요 면적</span></div>
    </div>
  </aside>

  <main class="view3d" aria-label="3D 뷰">
    <canvas id="c3d"></canvas>
    <div class="hud" role="group" aria-label="시점">
      <button type="button" data-view="iso" aria-pressed="true">등각</button>
      <button type="button" data-view="front">정면</button>
      <button type="button" data-view="side">측면</button>
      <button type="button" data-view="top">위</button>
      <button type="button" data-view="back">뒤</button>
    </div>
    <div class="explode">
      <label for="explode">분해도</label>
      <input id="explode" type="range" min="0" max="100" value="0" aria-label="분해 정도">
    </div>
  </main>

  <section class="draw" aria-label="2D 도면">
    <div class="panelhead"><h2>제작 도면</h2><span class="eyebrow mono">UNIT mm · 3각법</span></div>
    <div class="svgwrap" id="svgwrap"></div>
  </section>

  <section class="bom" aria-label="부품표">
    <div class="panelhead"><h2>부품표</h2><span class="eyebrow">재단 치수 · 결 방향 기준</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>부품</th><th>수량</th><th>결 길이</th><th>결 폭</th><th>두께</th><th>결</th></tr></thead>
      <tbody id="bomBody"></tbody>
      <tfoot><tr><td colspan="6" id="bomFoot"></td></tr></tfoot>
    </table></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div class="dlg">
  <h3 id="dlgTitle">DXF 내용</h3>
  <p id="dlgMsg">이 화면에서는 파일 저장이 지원되지 않습니다. 아래 내용을 복사해 <code>cabinet.dxf</code>로 저장하면 AutoCAD·LibreCAD·FreeCAD에서 열립니다.</p>
  <textarea id="dlgText" readonly spellcheck="false"></textarea>
  <div class="row"><button type="button" id="dlgCopy">복사</button><button type="button" id="dlgClose" class="primary">닫기</button></div>
</div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const state = { W:800, D:400, H:1800, T:18, TB:9, shelves:3, plinth:80, topStyle:'inset', doors:2, explode:0 };
const fmt = n => { const r = Math.round(n*10)/10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 모델: 파라미터 → 부품 목록 (단일 진실 공급원) ───────── */
function buildModel(s){
  const {W,D,H,T,TB,shelves,plinth,topStyle,doors} = s;
  const CD = D - TB;                         // 몸통 깊이 (뒷판 제외)
  const sideH = topStyle === 'overlay' ? H - T : H;
  const bz = plinth;                         // 하판 밑면 높이
  const parts = [];
  const add = (name,x,y,z,w,d,h,dir,cut) => parts.push({name,x,y,z,w,d,h,dir,cut});
  add('측판', 0,   0, 0, T, CD, sideH, [-1,0,0], {L:sideH, W:CD, T, grain:'세로'});
  add('측판', W-T, 0, 0, T, CD, sideH, [ 1,0,0], {L:sideH, W:CD, T, grain:'세로'});
  const tx = topStyle === 'overlay' ? 0 : T, tw = topStyle === 'overlay' ? W : W - 2*T;
  add('상판', tx, 0, H-T, tw, CD, T, [0,0,1], {L:tw, W:CD, T, grain:'가로'});
  add('하판', T, 0, bz, W-2*T, CD, T, [0,0,-1], {L:W-2*T, W:CD, T, grain:'가로'});
  const innerH = (H - T) - (bz + T);
  const pitch = (innerH - shelves*T) / (shelves + 1);
  for (let i = 0; i < shelves; i++){
    const z = bz + T + (i+1)*pitch + i*T;
    add('선반', T, 0, z, W-2*T, CD, T, [0,-0.55,0], {L:W-2*T, W:CD, T, grain:'가로'});
  }
  if (plinth > 0) add('걸레받이', T, 30, 0, W-2*T, T, plinth, [0,-0.8,-0.5], {L:W-2*T, W:plinth, T, grain:'가로'});
  add('뒷판', 0, CD, 0, W, TB, H, [0,1,0], {L:H, W:W, T:TB, grain:'세로'});
  if (doors > 0){
    const gap = 3, reveal = 2, n = doors;
    const dw = (W - 2*reveal - (n-1)*gap) / n, dh = H - bz - 2*reveal;
    for (let k = 0; k < n; k++)
      add('문짝', reveal + k*(dw+gap), -T, bz + reveal, dw, T, dh, [0,-1.7,0], {L:dh, W:dw, T, grain:'세로'});
  }
  return { parts, pitch, CD, bz, sideH, innerH, innerW: W-2*T };
}

/* ───────── 2D 도면: 프리미티브 생성 (SVG·DXF 공용) ───────── */
const TH = 30; // 치수 문자 높이
function buildDrawing(s, m){
  const {W,D,H,T,TB} = s;
  const P = [];
  const line = (x1,y1,x2,y2,layer='OUTLINE') => P.push({t:'line',x1,y1,x2,y2,layer});
  const rect = (x,y,w,h,layer='OUTLINE') => { line(x,y,x+w,y,layer); line(x+w,y,x+w,y+h,layer); line(x+w,y+h,x,y+h,layer); line(x,y+h,x,y,layer); };
  const text = (str,x,y,h,layer='TEXT',align='MC',rot=0) => P.push({t:'text',str,x,y,h,layer,align,rot});
  const hatch = (x,y,w,h) => {                      // ANSI31 45° 단면 해치
    const sp = 12, c0 = Math.ceil((y-(x+w))/sp)*sp, c1 = y+h-x;
    for (let c = c0; c <= c1; c += sp){
      const pts = []; let v;
      v = x+c;   if (v >= y && v <= y+h) pts.push([x, v]);
      v = x+w+c; if (v >= y && v <= y+h) pts.push([x+w, v]);
      v = y-c;   if (v > x && v < x+w) pts.push([v, y]);
      v = y+h-c; if (v > x && v < x+w) pts.push([v, y+h]);
      if (pts.length >= 2) line(pts[0][0],pts[0][1],pts[1][0],pts[1][1],'HATCH');
    }
  };
  const tick = (x,y) => line(x-9,y-9,x+9,y+9,'DIM');
  const dimH = (x1,x2,y,off) => {
    const sg = Math.sign(off)||1, yl = y+off;
    line(x1,y+sg*8,x1,yl+sg*14,'DIM'); line(x2,y+sg*8,x2,yl+sg*14,'DIM'); line(x1,yl,x2,yl,'DIM');
    tick(x1,yl); tick(x2,yl);
    text(fmt(Math.abs(x2-x1)), (x1+x2)/2, yl - sg*(TH/2+8), TH, 'DIM');
  };
  const dimV = (y1,y2,x,off) => {
    const sg = Math.sign(off)||1, xl = x+off;
    line(x+sg*8,y1,xl+sg*14,y1,'DIM'); line(x+sg*8,y2,xl+sg*14,y2,'DIM'); line(xl,y1,xl,y2,'DIM');
    tick(xl,y1); tick(xl,y2);
    text(fmt(Math.abs(y2-y1)), xl - sg*(TH/2+8), (y1+y2)/2, TH, 'DIM', 'MC', 90);
  };
  const carcass = m.parts.filter(p => p.name !== '뒷판' && p.name !== '문짝');
  const doors = m.parts.filter(p => p.name === '문짝');

  // 정면도 — 문짝은 숨은선
  carcass.forEach(p => rect(p.x, p.z, p.w, p.h));
  doors.forEach(p => rect(p.x, p.z, p.w, p.h, 'HIDDEN'));
  dimH(0, W, 0, -120);
  dimH(0, T, H, 120);
  dimV(0, H, W, 250);
  let prev = m.bz + T;
  m.parts.filter(p => p.name === '선반').forEach(p => { dimV(prev, p.z, W, 120); prev = p.z + T; });
  dimV(prev, H - T, W, 120);
  if (m.bz > 0) dimV(0, m.bz, W, 120);
  text('정면도  FRONT VIEW', W/2, -270, 46);

  // 측면 단면도 — 절단면 x = W/4 (문짝·선반 관통)
  const ox = W + 520, xc = W/4;
  const cutS = m.parts.filter(p => p.name !== '측판' && p.x <= xc && xc <= p.x + p.w);
  cutS.forEach(p => { rect(ox + p.y, p.z, p.d, p.h); hatch(ox + p.y, p.z, p.d, p.h); });
  rect(ox, 0, m.CD, m.sideH, 'HIDDEN');
  dimH(ox, ox + D, 0, -120);
  dimH(ox + m.CD, ox + D, H, 120);
  if (doors.length) dimH(ox - T, ox, H, 120);
  dimV(0, H, ox + D, 120);
  text('측면 단면도  SIDE SECTION', ox + D/2, -270, 46);

  // 평면 단면도 — 절단면 z = 상판 아래 100
  const oy = H + 620, zc = H - T - 100;
  const cutT = m.parts.filter(p => p.z <= zc && zc <= p.z + p.h);
  cutT.forEach(p => { rect(p.x, oy + p.y, p.w, p.d); hatch(p.x, oy + p.y, p.w, p.d); });
  rect(T, oy, W - 2*T, m.CD, 'HIDDEN');
  dimH(0, W, oy - (doors.length ? T : 0), -120);
  dimV(oy, oy + D, W, 120);
  dimV(oy + m.CD, oy + D, 0, -120);
  text('평면 단면도  TOP SECTION', W/2, oy - 270 - (doors.length ? T : 0), 46);

  // 부품표 + 표제란
  const bom = bomRows(m);
  const bx = ox + D + 420, by = H, cols = [0, 300, 420, 600, 780, 900, 1020], rh = 70;
  text('부품표  BOM', bx + cols[6]/2, by + 90, 46);
  const rows = [['부품명','수량','결길이','결폭','두께','결'], ...bom.map(r => [r.name, String(r.qty), fmt(r.L), fmt(r.W), String(r.T), r.grain])];
  rows.forEach((row, i) => {
    const y = by - i*rh;
    row.forEach((v, c) => text(v, bx + (cols[c]+cols[c+1])/2, y - rh/2, 28, 'TITLE'));
    line(bx, y, bx + cols[6], y, 'TITLE');
  });
  const yEnd = by - rows.length*rh;
  line(bx, yEnd, bx + cols[6], yEnd, 'TITLE');
  cols.forEach(c => line(bx + c, by, bx + c, yEnd, 'TITLE'));
  const ty = yEnd - 160;
  rect(bx, ty - 300, cols[6], 300, 'TITLE');
  line(bx, ty - 110, bx + cols[6], ty - 110, 'TITLE');
  text(`수납장  W${W} × D${D} × H${H}`, bx + cols[6]/2, ty - 55, 46, 'TITLE');
  text(`몸통 ${T}T · 뒷판 ${TB}T · 선반 ${s.shelves}단 · 문짝 ${s.doors}`, bx + cols[6]/2, ty - 165, 30, 'TITLE');
  text(`UNIT mm · 3각법 · ${new Date().toISOString().slice(0,10)}`, bx + cols[6]/2, ty - 245, 30, 'TITLE');

  let minx=Infinity, miny=Infinity, maxx=-Infinity, maxy=-Infinity;
  P.forEach(p => {
    if (p.t === 'line'){ minx=Math.min(minx,p.x1,p.x2); maxx=Math.max(maxx,p.x1,p.x2); miny=Math.min(miny,p.y1,p.y2); maxy=Math.max(maxy,p.y1,p.y2); }
    else { const hw = p.str.length*p.h*0.6/2; minx=Math.min(minx,p.x-hw); maxx=Math.max(maxx,p.x+hw); miny=Math.min(miny,p.y-p.h); maxy=Math.max(maxy,p.y+p.h); }
  });
  return { P, bbox:{minx,miny,maxx,maxy} };
}

function bomRows(m){
  const map = new Map();
  m.parts.forEach(p => {
    const k = `${p.name}|${p.cut.L}|${p.cut.W}|${p.cut.T}`;
    if (!map.has(k)) map.set(k, {name:p.name, qty:0, ...p.cut});
    map.get(k).qty++;
  });
  return [...map.values()];
}

/* ───────── SVG 렌더 ───────── */
function renderSVG(d){
  const {minx,miny,maxx,maxy} = d.bbox, pad = 140;
  const out = [];
  d.P.forEach(p => {
    if (p.t === 'line') out.push(`<line class="${p.layer}" x1="${p.x1}" y1="${-p.y1}" x2="${p.x2}" y2="${-p.y2}" vector-effect="non-scaling-stroke"/>`);
    else {
      const anchor = p.align === 'ML' ? 'start' : 'middle';
      const tr = p.rot ? ` transform="rotate(${-p.rot} ${p.x} ${-p.y})"` : '';
      out.push(`<text class="${p.layer}" x="${p.x}" y="${-p.y}" font-size="${p.h*1.3}" text-anchor="${anchor}" dominant-baseline="central"${tr}>${esc(p.str)}</text>`);
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minx-pad} ${-(maxy+pad)} ${maxx-minx+2*pad} ${maxy-miny+2*pad}" preserveAspectRatio="xMidYMid meet" fill="none" stroke-linecap="round">${out.join('')}</svg>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 저장용 SVG: 테마 변수 대신 고정 색 (검정 선, 빨강 치수)
function svgForFile(d){
  const css = `<style>line{stroke:#000;stroke-width:0.35}.HIDDEN{stroke:#666;stroke-dasharray:6 3;stroke-width:0.25}.DIM{stroke:#c0392b;stroke-width:0.2}.HATCH{stroke:#777;stroke-width:0.15}text{font-family:'IBM Plex Mono','Apple SD Gothic Neo','Malgun Gothic',monospace;fill:#333}text.DIM{fill:#c0392b}text.TEXT{fill:#1F5FA8}</style>`;
  return renderSVG(d).replace('<svg ', '<svg width="' + (d.bbox.maxx-d.bbox.minx+280) + 'mm" ').replace('>', '>' + css);
}

/* ───────── DXF 작성 (R12 / AC1009) ───────── */
const dxfText = s => Array.from(s).map(ch => ch.charCodeAt(0) > 127 ? '\\U+' + ch.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0') : ch).join('');
const fx = n => String(Math.round(n*1000)/1000);
function buildDXF(d){
  const L = [];
  const g = (c, v) => { L.push(String(c)); L.push(String(v)); };
  const layers = [['OUTLINE',7,'CONTINUOUS'],['HIDDEN',8,'DASHED'],['DIM',1,'CONTINUOUS'],['TEXT',3,'CONTINUOUS'],['HATCH',8,'CONTINUOUS'],['TITLE',7,'CONTINUOUS']];
  g(0,'SECTION'); g(2,'HEADER');
  g(9,'$ACADVER'); g(1,'AC1009');
  g(9,'$EXTMIN'); g(10,fx(d.bbox.minx)); g(20,fx(d.bbox.miny)); g(30,0);
  g(9,'$EXTMAX'); g(10,fx(d.bbox.maxx)); g(20,fx(d.bbox.maxy)); g(30,0);
  g(0,'ENDSEC');
  g(0,'SECTION'); g(2,'TABLES');
  g(0,'TABLE'); g(2,'LTYPE'); g(70,2);
  g(0,'LTYPE'); g(2,'CONTINUOUS'); g(70,0); g(3,'Solid line'); g(72,65); g(73,0); g(40,0);
  g(0,'LTYPE'); g(2,'DASHED'); g(70,0); g(3,'Dashed __ __ __'); g(72,65); g(73,2); g(40,15); g(49,10); g(49,-5);
  g(0,'ENDTAB');
  g(0,'TABLE'); g(2,'LAYER'); g(70,layers.length);
  layers.forEach(([n,c,lt]) => { g(0,'LAYER'); g(2,n); g(70,0); g(62,c); g(6,lt); });
  g(0,'ENDTAB');
  g(0,'TABLE'); g(2,'STYLE'); g(70,1);
  g(0,'STYLE'); g(2,'STANDARD'); g(70,0); g(40,0); g(41,1); g(50,0); g(71,0); g(42,2.5); g(3,'txt'); g(4,'');
  g(0,'ENDTAB');
  g(0,'ENDSEC');
  g(0,'SECTION'); g(2,'ENTITIES');
  d.P.forEach(p => {
    if (p.t === 'line'){ g(0,'LINE'); g(8,p.layer); g(10,fx(p.x1)); g(20,fx(p.y1)); g(30,0); g(11,fx(p.x2)); g(21,fx(p.y2)); g(31,0); }
    else {
      g(0,'TEXT'); g(8,p.layer); g(10,fx(p.x)); g(20,fx(p.y)); g(30,0); g(40,fx(p.h)); g(1,dxfText(p.str));
      if (p.rot) g(50,p.rot);
      g(72, p.align === 'ML' ? 0 : 1); g(73,2); g(11,fx(p.x)); g(21,fx(p.y)); g(31,0);
    }
  });
  g(0,'ENDSEC'); g(0,'EOF');
  return L.join('\r\n') + '\r\n';
}

/* ───────── 3D (three.js) ───────── */
let renderer, scene, camera, group, grid;
const cam = { theta:0.75, phi:1.15, r:3200, tTheta:0.75, tPhi:1.15, tR:3200 };
const VIEWS = { iso:[0.75,1.15], front:[0,Math.PI/2], side:[Math.PI/2,Math.PI/2], top:[0,0.02], back:[Math.PI,Math.PI/2] };
const mats = {};
function mat(t, door){
  const key = (door ? 'door' : '') + t;
  if (!mats[key]) mats[key] = new THREE.MeshStandardMaterial({ color: door ? 0xE4CBA2 : (t < 12 ? 0xC7A874 : 0xD9B98A), roughness:0.88, metalness:0 });
  return mats[key];
}
const edgeMat = new THREE.LineBasicMaterial({ color:0x4E3A24, transparent:true, opacity:0.55 });
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function makeGrid(){
  if (grid){ scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  const size = Math.max(state.W, state.D) * 3;
  grid = new THREE.GridHelper(size, Math.round(size/100), new THREE.Color(cssVar('--grid')), new THREE.Color(cssVar('--grid2')));
  grid.position.y = -state.H/2 - 1;
  scene.add(grid);
}
function init3D(){
  const cv = $('#c3d');
  renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(32, 1, 10, 60000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6f7f90, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(1500, 2600, 2200); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(-2000, 800, -1500); scene.add(fill);
  group = new THREE.Group(); scene.add(group);
  makeGrid();
  const wrap = cv.parentElement;
  const resize = () => { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(wrap); resize();
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drag) return; cam.tTheta -= (e.clientX-drag.x)*0.006; cam.tPhi = Math.min(Math.PI-0.02, Math.max(0.02, cam.tPhi + (e.clientY-drag.y)*0.006)); drag = {x:e.clientX, y:e.clientY}; setPressed(null); });
  cv.addEventListener('pointerup', () => drag = null);
  cv.addEventListener('pointercancel', () => drag = null);
  cv.addEventListener('wheel', e => { e.preventDefault(); cam.tR = Math.min(30000, Math.max(400, cam.tR * Math.exp(e.deltaY*0.0012))); }, {passive:false});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', makeGrid);
  new MutationObserver(makeGrid).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  (function loop(){
    requestAnimationFrame(loop);
    const k = reduced ? 1 : 0.14;
    cam.theta += (cam.tTheta-cam.theta)*k; cam.phi += (cam.tPhi-cam.phi)*k; cam.r += (cam.tR-cam.r)*k;
    camera.position.set(cam.r*Math.sin(cam.phi)*Math.sin(cam.theta), cam.r*Math.cos(cam.phi), cam.r*Math.sin(cam.phi)*Math.cos(cam.theta));
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  })();
}
function rebuild3D(m){
  while (group.children.length){ const c = group.children.pop(); c.geometry.dispose(); c.children.forEach(e => e.geometry.dispose()); }
  const {W,D,H} = state;
  m.parts.forEach(p => {
    const geo = new THREE.BoxGeometry(p.w, p.h, p.d);
    const mesh = new THREE.Mesh(geo, mat(p.cut.T, p.name === '문짝'));
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
    mesh.userData = { base:[p.x + p.w/2 - W/2, p.z + p.h/2 - H/2, D/2 - (p.y + p.d/2)], dir:[p.dir[0], p.dir[2], -p.dir[1]] };
    group.add(mesh);
  });
  applyExplode();
  makeGrid();
  cam.tR = Math.max(W, H, D) * 1.9 + 500;
}
function applyExplode(){
  const e = state.explode * Math.max(state.H, state.W) * 0.28;
  group.children.forEach(c => { const {base,dir} = c.userData; c.position.set(base[0]+dir[0]*e, base[1]+dir[1]*e, base[2]+dir[2]*e); });
}
function setPressed(v){ document.querySelectorAll('.hud button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }

/* ───────── 화면 갱신 ───────── */
let drawing = null;
function update(){
  const m = buildModel(state);
  rebuild3D(m);
  drawing = buildDrawing(state, m);
  $('#svgwrap').innerHTML = renderSVG(drawing);
  const rows = bomRows(m);
  $('#bomBody').innerHTML = rows.map(r => `<tr><td>${r.name}</td><td class="mono">${r.qty}</td><td class="mono">${fmt(r.L)}</td><td class="mono">${fmt(r.W)}</td><td class="mono">${r.T}</td><td class="grain">${r.grain}</td></tr>`).join('');
  const area = {}; rows.forEach(r => area[r.T] = (area[r.T]||0) + r.qty*r.L*r.W/1e6);
  $('#bomFoot').textContent = `총 ${rows.reduce((a,r)=>a+r.qty,0)}개 · 결 길이는 나뭇결(무늬) 방향 치수 · 재단 여유 미포함`;
  $('#stPitch').textContent = state.shelves ? fmt(m.pitch) + ' mm' : fmt(m.innerH) + ' mm';
  $('#stInner').textContent = `${fmt(m.innerW)} × ${fmt(m.CD)}`;
  $('#stAreaT').textContent = (area[state.T]||0).toFixed(2) + ' m²'; $('#stAreaTLabel').textContent = `${state.T}T 소요 면적`;
  $('#stAreaB').textContent = (area[state.TB]||0).toFixed(2) + ' m²'; $('#stAreaBLabel').textContent = `${state.TB}T 소요 면적`;
}

/* ───────── 입력 바인딩 ───────── */
document.querySelectorAll('[data-key]').forEach(el => {
  el.addEventListener('input', () => {
    let v = Number(el.value);
    if (el.type === 'number'){ if (!Number.isFinite(v)) return; v = Math.min(Number(el.max), Math.max(Number(el.min), v)); }
    state[el.dataset.key] = v;
    if (el.id === 'shelves') $('#shelvesVal').textContent = v;
    update();
  });
  el.addEventListener('change', () => { if (el.type === 'number') el.value = state[el.dataset.key]; });
});
document.querySelectorAll('input[name=topStyle]').forEach(r => r.addEventListener('change', () => { state.topStyle = r.value; update(); }));
document.querySelectorAll('input[name=doors]').forEach(r => r.addEventListener('change', () => { state.doors = Number(r.value); update(); }));
$('#explode').addEventListener('input', e => { state.explode = e.target.value/100; applyExplode(); });
document.querySelectorAll('.hud button').forEach(b => b.addEventListener('click', () => { const [t,p] = VIEWS[b.dataset.view]; cam.tTheta = t; cam.tPhi = p; setPressed(b.dataset.view); }));

/* ───────── 내보내기 ───────── */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const fileBase = () => `cabinet_W${state.W}xD${state.D}xH${state.H}`;
async function getDownloads(){ try { return window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { return null; } }
function showFallback(title, msg, content){
  $('#dlgTitle').textContent = title; $('#dlgMsg').textContent = msg; $('#dlgText').value = content; $('#dlg').showModal();
}
const standalone = !window.claude;            // GitHub Pages 등 일반 호스팅: 브라우저 다운로드 직접 사용
function directDownload(name, data){
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type:'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    return true;
  } catch { return false; }
}
async function save(filename, data, fallback){
  if (standalone){ if (directDownload(filename, data)) toast(`${filename} 다운로드`); else fallback(); return; }
  const dl = await getDownloads();
  if (!dl){ fallback(); return; }
  try { await dl.save({ filename, data }); toast(`${filename} 저장됨`); }
  catch (e){
    if (e && e.code === 'declined') return;
    if (e && e.code === 'rate_limited'){ toast('잠시 후 다시 시도하세요'); return; }
    fallback();
  }
}
$('#btnDxf').addEventListener('click', async () => {
  const dxf = buildDXF(drawing);
  const fallback = () => showFallback('DXF 내용', '이 화면에서는 파일 저장이 지원되지 않습니다. 아래 내용을 복사해 cabinet.dxf 로 저장하면 AutoCAD·LibreCAD·FreeCAD에서 열립니다.', dxf);
  if (standalone){ await save(fileBase() + '.dxf', dxf, fallback); return; }
  const zip = new JSZip(); zip.file(fileBase() + '.dxf', dxf);   // claude.ai 저장 기능은 .dxf 확장자를 받지 않아 zip으로 포장
  const blob = await zip.generateAsync({ type:'blob' });
  await save(fileBase() + '.zip', blob, fallback);
});
$('#btnSvg').addEventListener('click', async () => {
  const svg = svgForFile(drawing);
  await save(fileBase() + '.svg', svg, () => showFallback('SVG 내용', '이 화면에서는 파일 저장이 지원되지 않습니다. 아래 내용을 복사해 .svg 파일로 저장하세요.', svg));
});
$('#dlgClose').addEventListener('click', () => $('#dlg').close());
$('#dlgCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('#dlgText').value); toast('복사됨'); } catch { $('#dlgText').select(); toast('Ctrl/Cmd+C 로 복사하세요'); } });

init3D();
update();
})();
</script>

</html>
