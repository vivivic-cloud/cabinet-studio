/* ───────── 밴드가 측판보다 튀어나오는 것을 경고한다 ─────────
   사장님 말씀 — 「밴드 두께를 15mm 이상 선택시 측판을 넘어 튀어 나오는 것을 경고.
   3D 가 그 자리로 확대되고 등각 시선으로 보이며 밴드가 붉게 여러 번 깜박인다.
   무시할 수 없으므로 두께를 15mm 로 자동조정한 뒤 바뀌었음을 알린다.」

   두 가지는 관리자가 정해 사장님께 말씀드린 것이다 —
   ① **15 는 그냥 두고 15 를 넘을 때만** 경고한다. 15 에서 경고하고 다시 15 로 맞추면 끝없이 돈다.
   ② **정말 튀어나올 때만** 경고한다. 덮기는 밴드가 가구 안쪽에 있어 아무리 두꺼워도 안 나온다 —
      거기서 「튀어나왔다」 고 하면 거짓이 된다. 그래서 `m.밴드넘침 > 0` 일 때만 (= 끼우기) 뜬다. */
const 밴드한계 = 15;
let 경고중 = false;
function 밴드살피기(){
  if (경고중) return;
  const m = 모델;
  if (!m) return;
  /* 15mm 자동조정은 **밴드만** 받는다 (09-30 사장님 말씀).
     09-17 에 사장님이 시키신 것은 밴드였고, 보호대에 같은 규칙을 건 것은 우리 쪽 판단이었다(§4.87).
     보호대는 이제 자리를 앞으로 물려 넘침이 0 이므로 어떤 두께에서도 안 뜬다.
     **`자리있는부속` 자체에서 보호대를 빼지는 않았다** — 그 목록은 부품표에서 「만든 부속」 줄을 거르는 데도 쓰여서
     (`bomRows`·`부속행들`) 빼면 보호대가 **부품표에 두 줄로 나온다.** 그래서 이 고리만 밴드로 좁혔다. */
  for (const 이름 of ['밴드']){
    const c = 만든부속.find(x => x.이름 === 이름);
    if (!c || !(c.T > 밴드한계)) continue;             // 15 이하는 여기서 끝 — 아래는 아예 안 돈다
    const 넘침 = (m.넘침들 || {})[이름] || 0;
    if (!(넘침 > 0)) continue;                         // 안 튀어나오면 경고하지 않는다(덮기가 여기서 걸린다)
    const 두께 = c.T;
    경고중 = true;
    const 그부속 = m.parts.find(p => p.name === 이름 && !p.숨김);
    const 조각 = (group && 그부속) ? group.children.find(x => x.userData.pid === 그부속.pid) : null;
    밴드깜박(조각, () => {
      c.T = 밴드한계; 담기(); 부속그리기(); update();   // 자동 조정
      경고중 = false;
      $('#warnTitle').textContent = `${이름}가 측판보다 튀어나옵니다`;
      $('#warnMsg').textContent =
        `${이름} 두께 ${fmt(두께)}mm 는 측판 뒤끝보다 ${fmt(넘침)}mm 뒤로 튀어나옵니다. `
        + `두께를 ${밴드한계}mm 로 맞췄습니다.`;
      const dlg = $('#warnDlg');
      if (dlg.showModal && !dlg.open) dlg.showModal(); else toast(`${이름} 두께를 ${밴드한계}mm 로 맞췄습니다`);
    });
    return;                                            // 한 번에 하나만 알린다
  }
}
// 그 자리로 다가가 등각으로 돌리고, 밴드를 붉게 여러 번 깜박인다.
// **끝나면 보시던 자리로 카메라를 돌려놓는다.** 안 돌려놓으면 가구 뒤 밴드에 붙은 채 서 있어
// 앞면 문짝이 화면 밖으로 나간다 — 「3D 도면 도어 사라짐」 이라 하신 것이 이 자리였다.
function 밴드깜박(조각, 끝나면){
  if (!조각 || !camera){ 끝나면(); return; }           // 3D 가 못 뜬 판에서는 조정만 하고 넘어간다
  const 본자리 = { theta:cam.tTheta, phi:cam.tPhi, r:cam.tR, tgt:cam.tTgt.clone() };
  const 되돌리기 = () => { cam.tTheta = 본자리.theta; cam.tPhi = 본자리.phi; cam.tR = 본자리.r; cam.tTgt.copy(본자리.tgt); };
  const [t, ph] = VIEWS.iso; cam.tTheta = t; cam.tPhi = ph;
  const b = 조각.userData.base;
  cam.tTgt.set(b[0], b[1], b[2]);                      // 밴드 한가운데를 본다
  cam.tR = Math.max(420, state.W * 0.85);              // 그만큼 다가간다
  그리자();
  // 깜박이는 동안에도 모서리선이 똑같이 보이게 같은 polygonOffset 을 준다
  if (!밴드붉음) 밴드붉음 = new THREE.MeshStandardMaterial({ color:0xFF3B30, emissive:0xFF3B30, emissiveIntensity:0.55, roughness:0.6, metalness:0,
    polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
  let n = 0;

/* ───────── 도면에서 고른 부속의 옵션을 그 자리에서 (10-04 사장님 말씀) ─────────

const 옵션판 = 이름 => document.querySelector(`.opt[data-opt="${CSS.escape(본이름(이름))}"]`);

/* ───────── 폰에서 3D 에 집중하기 ─────────

   ② 한 번 접히면 그대로 둔다. 만질 때마다 폈다 접었다 하면 어지럽다.

(function(){

(function(){

function 열쇠옮기기(){

function 이름목록갱신(){
  const 칸 = $('#partNames'); if (!칸 || 칸.hidden) return;
  고르개펼치기(true);
}
function 고르개펼치기(그대로){
  const 칸 = $('#partNames'), 입 = $('#newPart'); if (!칸) return;
  const 친 = 입.value.trim();
  const 목록 = 되살릴것().filter(x => !친 || x.이름.includes(친));
  칸.innerHTML = 목록.map((x,i) => `<button type="button" data-back="${i}" role="option">${esc(x.이름)}</button>`).join('');
  칸.querySelectorAll('button[data-back]').forEach(el => {
    el.addEventListener('mousedown', e => e.preventDefault());       // 칸에서 초점이 안 빠지게
    // 고르면 **칸에 넣기만 한다.** 되살리는 것은 「추가」 다 —
    // 사장님 말씀(09-22) 「드롭다운 선택 후 추가 버튼을 누르면 다시 활성화 부속으로 추가되어야 하는데
    // 지금은 드롭 선택과 동시에 활성화 되어버림」. 09-17 에 「고르면 바로」 로 두었던 것을 되돌린 것이다.
    el.addEventListener('click', () => {
      $('#newPart').value = 목록[+el.dataset.back].이름; $('#addWarn').textContent = ''; 고르개접기();
    });
  });
  const 편다 = 목록.length > 0;
  칸.hidden = !편다; 입.setAttribute('aria-expanded', String(편다));
}
function 고르개접기(){ const 칸 = $('#partNames'); if (칸)칸.hidden = true;
  $('#newPart').setAttribute('aria-expanded','false'); }
$('#newPart').addEventListener('focus', () => 고르개펼치기());
$('#newPart').addEventListener('click', () => 고르개펼치기());
$('#newPart').addEventListener('input', () => { $('#addWarn').textContent = ''; 고르개펼치기(); });
$('#newPart').addEventListener('keydown', e => { if (e.key === 'Escape') 고르개접기(); });
document.addEventListener('pointerdown', e => {

});
$('#btnAdd').addEventListener('click', () => {

  if (!이름){ 알림.textContent = '이름을 적어 주세요'; return; }
  // 지운 부속 이름이면 여기서 되살린다 — 고르개에서 고르든 손으로 적든 같은 길이다(사장님 말씀 09-22).
  // 붙박이(상판·측판 …)도 이 길로 돌아온다. 아래 「이미 있는 이름」 막이보다 **먼저** 본다.
  const 되살릴 = 되살릴것().find(x => x.이름 === 이름);
  if (되살릴){ 알림.textContent = ''; 되살리기(되살릴); return; }
  if (붙박이.includes(이름) || 만든부속.some(c => c.이름 === 이름)){
    알림.textContent = `이미 있는 이름입니다 — ${이름}`; return; }
  const 지난 = 지난부속.find(x => x.이름 === 이름);      // 전에 만들었던 것이면 두께·단을 그대로 살린다

});

    if (!Number.isFinite(v)) return;
    규칙[el.dataset.rule] = Math.min(Number(el.max), Math.max(Number(el.min), v));
    담기(); update();
  }));
  $('#rTable').querySelectorAll('input[name=인선반줄임]').forEach(r => r.addEventListener('change', () => {
    규칙.인선반줄임 = r.value === '1'; 담기(); update(); }));
}
// 제어판을 열어 둔 채 치수를 바꾸면 칸 없는 줄의 값도 따라 바뀌어야 한다.
// 칸(입력) 은 건드리지 않는다 — 적는 중에 새로 그리면 글자가 날아간다.
function 표값갱신(){
  if (!$('#rulesDlg').open || !모델) return;
  $('#rTable').querySelectorAll('.fix[data-k]').forEach(el => {
    const r = 관계표[+el.dataset.k];
    if (r && r.값) el.textContent = String(r.값(모델, state));
  });
}
function 제어판그리기(){
  $('#rName').value = 규칙.이름;
  표그리기();
  const 목록 = [...손질.숨김.map(k => ['숨김', k]), ...손질.지움.map(k => ['삭제', k]),
               ...Object.keys(손질.복제).filter(k => 손질.복제[k] > 0).map(k => [`복제 +${손질.복제[k]}`, k])];
  $('#rFix').innerHTML = 목록.length
    ? 목록.map(([무엇, k], i) => `<div class="rrow"><label>${esc(k.split('@')[0])} <small>${esc(무엇)} · 자리 ${esc(k.split('@')[1] || '')}</small></label>` +
        `<button type="button" data-fix="${i}">되돌리기</button></div>`).join('')
    : '<p class="none"></p>';
  $('#rFix').querySelectorAll('button[data-fix]').forEach(el => el.addEventListener('click', () => {
    const [무엇, k] = 목록[+el.dataset.fix];
    if (무엇 === '숨김') 손질.숨김 = 손질.숨김.filter(x => x !== k);
    else if (무엇 === '삭제') 손질.지움 = 손질.지움.filter(x => x !== k);
    else delete 손질.복제[k];
    담기(); 제어판그리기(); update();
  }));
}
/* ───────── 2D · 3D 모드 — 한 번에 하나만 보인다 (09-22 사장님 말씀) ─────────
   「제작도면 쪽은 2D보기 변환하면 현 3d 화면 사라지고 보이게 해줘 2d 3d 모드변환 으로 둘중 하나만 보기로 하자」
   가르는 것은 `.view3d` 와 `.draw` 둘뿐이다 — **부품표는 두 모드 다 그대로 보인다.**
   처음 열면 3D 다. 단추는 두 칸에 하나씩 있어 어느 모드에서나 눈앞에 있다.
   3D 는 숨은 동안 크기를 못 재므로 다시 켤 때 `삼디크기맞추기()` 로 렌더러·카메라를 다시 잡는다.
   2D 는 숨은 동안 `#svgwrap` 폭이 0 이라 글자 배율이 틀어진다 — 다시 켤 때 도면을 다시 그린다. */
let 보기모드 = '3d';
// 치수 띠를 **보이는 칸**으로 옮겨 붙인다 — 3D 든 2D 든 늘 보이고 늘 고칠 수 있어야 한다.
// 2D 에서는 머리줄(`제작 도면 … 3D|2D`)을 덮지 않게 그 밑으로 내린다.
function 모드띠맞추기(){
  const 띠 = $('#dimsBar'); if (!띠) return;
  const 칸 = 보기모드 === '2d' ? document.querySelector('.draw') : document.querySelector('.view3d');
  if (칸 && 띠.parentElement !== 칸) 칸.appendChild(띠);
  const 머리 = 보기모드 === '2d' ? document.querySelector('.draw .panelhead') : null;
  /* 10-01 사장님 말씀 — 두 모드의 자리가 같아야 한다. 칸의 **보이는 속 윗끝에서 12** 다.
     2D 는 머리줄이 그 위에 있으므로 머리줄 높이를 더한다(폰은 머리줄이 숨어 0 이라 12 그대로). */
  띠.style.top = 머리 ? (머리.offsetHeight + 12) + 'px' : '';
}
function 모드바꾸기(m){
  const 새 = (m === '2d') ? '2d' : '3d';
  const 판 = document.querySelector('.app');
  보기모드 = 새;
  판.classList.toggle('m2d', 새 === '2d');
  판.classList.toggle('m3d', 새 === '3d');
  document.querySelectorAll('.modeseg button[data-mode]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === 새)));
  requestAnimationFrame(() => {                    // 칸이 다시 자리를 잡은 뒤에 잰다
    모드띠맞추기();
    if (새 === '3d'){ 삼디크기맞추기(); 그리자(); }
    else 도면그리기();                              // 폭이 제대로 잡힌 뒤라야 글자 배율이 맞는다
  });
}
addEventListener('resize', () => 모드띠맞추기());   // 머리줄이 두 줄로 접히면 띠 자리도 따라간다
document.querySelectorAll('.modeseg button[data-mode]').forEach(b =>
  b.addEventListener('click', () => 모드바꾸기(b.dataset.mode)));

$('#btnRules').addEventListener('click', () => { 제어판그리기(); $('#rulesDlg').showModal(); });
$('#rClose').addEventListener('click', () => $('#rulesDlg').close());
$('#rX').addEventListener('click', () => $('#rulesDlg').close());
$('#rReset').addEventListener('click', () => { 규칙 = { ...규칙기본 }; 담기(); 제어판그리기(); update(); });
$('#rName').addEventListener('input', () => { 규칙.이름 = $('#rName').value; 담기(); });
$('#btnUndo').addEventListener('click', 되돌리기한단계);

/* ───────── 머리띠 「모바일 보기」 (10-04 관리자) ─────────
   사장님 말씀: 「프로그램 상단 헤더에 모바일 보기를 만들어 모바일 환경에서 화면이 어떻게 처리 되는지 확인해야겠어」
   ⚠ 폰 갈래는 `@media screen and (max-width:1100px)` 라 **창 폭**을 본다. 칸을 375 로 좁히거나
     `transform` 으로 줄여서는 **안 걸린다.** 규칙을 베껴 두 벌로 만드는 길은 금지다(한쪽만 고치면 어긋난다).
     그래서 **같은 쪽을 375px 폭 틀(iframe) 안에 띄운다** — 틀 안에서는 창 폭이 진짜로 375 라
     지금 그 규칙이 **그대로** 걸린다. `vh` 도 틀 높이를 보므로 60vh·84vh 까지 폰처럼 잰다.
   ⚠ 틀 안에서는 `#btnPhone` 이 폰 갈래로 숨으므로 **제 안에 또 열리지 않는다**(되돌이 막이).
   닫을 때 `about:blank` 로 돌린다 — 안 그러면 안 보이는 3D 가 그대로 돌아간다. */
(function(){
  const 단추 = $('#btnPhone'), 판 = $('#phoneDlg'), 틀 = $('#phoneFrame'), 키 = $('#phoneH');
  if (!단추 || !판 || !틀) return;
  const 닫기 = () => { if (판.open) 판.close(); };
  단추.addEventListener('click', () => {
    if (판.open) return 닫기();
    틀.src = location.href;
    판.show();                                   // 모달이 아니다 — 뒤가 안 굳어야 다시 눌러 닫을 수 있다
    단추.setAttribute('aria-pressed', 'true');
    if (키) 키.textContent = Math.round(틀.getBoundingClientRect().height);
  });
  $('#phoneX').addEventListener('click', 닫기);
  판.addEventListener('close', () => { 틀.src = 'about:blank'; 단추.setAttribute('aria-pressed', 'false'); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && 판.open){ e.preventDefault(); 닫기(); } });
})();

// 마지막에 보던 품목에 고르개를 맞춘다 (10-02 · 담긴 것이 없으면 수납장)
품목고르개맞추기();
부속그리기();
열쇠옮기기();                 // 담겨 있던 옛 자리 열쇠를 굳은 열쇠로 한 번만 옮겨 담는다 (09-22)
// 담긴 외경을 띠의 칸에도 올린다 — `state` 가 곳간의 여섯째가 되어 열 때 값이 살아난다 (§4.9872)
상태칸맞추기();
init3D();
update();
})();
</script>
